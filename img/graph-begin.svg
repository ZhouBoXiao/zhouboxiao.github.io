<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="StreamBeginCapture 的六个动作与关键判断">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4B3FE3"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#A1A1AA"/>
    </marker>
  </defs>
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  </style>
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">StreamBeginCapture 的六步</text>
  <text class="ts" x="30" y="50">capture_session.cc:713 — 前两步是门槛，第四步是分水岭</text>

  <!-- 步骤列表 -->
  <rect x="36" y="70" width="404" height="396" rx="8" fill="#F7F7F8"/>

  <!-- 1 -->
  <circle cx="60" cy="100" r="11" fill="#4B3FE3"/>
  <text class="ts" x="56" y="104" style="fill:#FFFFFF;font-size:10px;">1</text>
  <text class="bd" x="82" y="97">OpenHugeBuff()</text>
  <text class="ts" x="82" y="116" style="fill:#71717A;">开大页缓冲 —— 后面要批量造几千个对象</text>

  <!-- 2 -->
  <circle cx="60" cy="152" r="11" fill="#4B3FE3"/>
  <text class="ts" x="56" y="156" style="fill:#FFFFFF;font-size:10px;">2</text>
  <text class="bd" x="82" y="149">CheckCaptureModelIsCaptured</text>
  <text class="ts" x="82" y="168" style="fill:#71717A;">模型已在捕获中 → 报错返回</text>

  <!-- 3 -->
  <circle cx="60" cy="204" r="11" fill="#4B3FE3"/>
  <text class="ts" x="56" y="208" style="fill:#FFFFFF;font-size:10px;">3</text>
  <text class="bd" x="82" y="201">ModelCreate(RT_MODEL_CAPTURE_MODEL)</text>
  <text class="ts" x="82" y="220" style="fill:#71717A;">mdl 为空才建；传了就用传的（条件子图）</text>

  <!-- 4 -->
  <circle cx="60" cy="266" r="11" fill="#B45309"/>
  <text class="ts" x="56" y="270" style="fill:#FFFFFF;font-size:10px;">4</text>
  <text class="bd" x="82" y="253">三个条件全中 → SetSoftwareSqEnable</text>
  <text class="mono" x="82" y="274" style="font-size:9.5px;fill:#B45309;">RT_FEATURE_MODEL_ACL_GRAPH_SOFTWARE_ENABLE</text>
  <text class="mono" x="82" y="288" style="font-size:9.5px;fill:#B45309;">TS_FEATURE_SOFTWARE_SQ_ENABLE</text>
  <text class="mono" x="82" y="302" style="font-size:9.5px;fill:#B45309;">FEATURE_TRSDRV_SQ_SUPPORT_DYNAMIC_BIND</text>
  <text class="ts" x="82" y="320" style="fill:#71717A;">缺一个就退化成预占真 SQ 的旧路</text>

  <!-- 5 -->
  <circle cx="60" cy="360" r="11" fill="#4B3FE3"/>
  <text class="ts" x="56" y="364" style="fill:#FFFFFF;font-size:10px;">5</text>
  <text class="bd" x="82" y="357">StreamAddToCaptureModelProc</text>
  <text class="ts" x="82" y="376" style="fill:#71717A;">建捕获流、挂进模型的 StreamList_</text>

  <!-- 6 -->
  <circle cx="60" cy="412" r="11" fill="#4B3FE3"/>
  <text class="ts" x="56" y="416" style="fill:#FFFFFF;font-size:10px;">6</text>
  <text class="bd" x="82" y="405">CaptureModeEnter(stm, mode)</text>
  <text class="ts" x="82" y="424" style="fill:#71717A;">登记模式、记下开捕获的线程 tid</text>
  <text class="ts" x="82" y="444" style="fill:#71717A;">Context 级模式取所有活跃捕获的最小值</text>

  <!-- 右侧：模式互斥 -->
  <text class="ts" x="466" y="90" style="fill:#71717A;">三个模式的互斥（IsCaptureModeSupport）</text>
  <path d="M466 98 L684 98" stroke="rgba(23,23,23,0.14)" stroke-width="1"/>

  <rect x="460" y="106" width="224" height="52" rx="6" fill="#F2F7FF"/>
  <text class="bd" x="472" y="126">RELAXED</text>
  <text class="ts" x="472" y="146" style="fill:#71717A;">谁都放行，不做检查</text>

  <rect x="460" y="166" width="224" height="68" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="bd" x="472" y="186">GLOBAL</text>
  <text class="ts" x="472" y="206" style="fill:#71717A;">Context 已是 GLOBAL → 拒绝</text>
  <text class="ts" x="472" y="224" style="fill:#71717A;">线程已是 THREAD_LOCAL → 拒绝</text>

  <rect x="460" y="242" width="224" height="68" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="bd" x="472" y="262">THREAD_LOCAL</text>
  <text class="ts" x="472" y="282" style="fill:#71717A;">线程已是 GLOBAL → 拒绝</text>
  <text class="ts" x="472" y="300" style="fill:#71717A;">线程已是 THREAD_LOCAL → 拒绝</text>

  <text class="ts" x="460" y="334" style="fill:#3F3A8C;">两个 THREAD_LOCAL 之间也互斥</text>
  <text class="ts" x="460" y="352" style="fill:#71717A;">因为线程本地状态放在一个全局容器里，</text>
  <text class="ts" x="460" y="370" style="fill:#71717A;">同线程重入会互相踩</text>

  <rect x="460" y="386" width="224" height="80" rx="6" fill="#FFF7ED" stroke="rgba(180,83,9,0.30)"/>
  <text class="ts" x="472" y="406" style="fill:#B45309;">语义与 CUDA 的</text>
  <text class="mono" x="472" y="424" style="font-size:9.5px;fill:#B45309;">cudaStreamCaptureMode</text>
  <text class="ts" x="472" y="442" style="fill:#B45309;">一一对应，名字都一样</text>
  <text class="ts" x="472" y="458" style="fill:#71717A;">它解决的是并发语义，不是性能</text>

  <!-- 底条 -->
  <rect x="36" y="478" width="648" height="30" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.10)"/>
  <text class="ts" x="48" y="497" style="fill:#71717A;">第 4 步是唯一影响性能的一步：开了逻辑 SQ，重复执行才能省掉重建；否则只是把下发时机推后了</text>
</svg>
