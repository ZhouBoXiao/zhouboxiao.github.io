<svg viewBox="0 0 600 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="线性广播、树形广播与树形归约">
  <title>线性广播 O(N)、树形广播 O(log N) 与树形归约</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A32D2D">笨办法：root 挨个发，O(N)</text>
  <circle cx="70" cy="52" r="15" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="70" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#A32D2D">root</text>
  <circle cx="70" cy="110" r="15" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="70" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#A32D2D">P1</text>
  <circle cx="150" cy="110" r="15" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="150" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#A32D2D">P2</text>
  <circle cx="230" cy="110" r="15" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="230" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#A32D2D">P3</text>
  <circle cx="310" cy="110" r="15" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="310" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#A32D2D">P4</text>
  <path d="M70 67 L70 95" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arrow)"/><text x="52" y="82" font-family="sans-serif" font-size="10" fill="#A32D2D">1</text>
  <path d="M82 62 L146 98" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arrow)"/><text x="120" y="80" font-family="sans-serif" font-size="10" fill="#A32D2D">2</text>
  <path d="M88 58 L222 98" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arrow)"/><text x="170" y="66" font-family="sans-serif" font-size="10" fill="#A32D2D">3</text>
  <path d="M92 56 L302 98" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arrow)"/><text x="220" y="58" font-family="sans-serif" font-size="10" fill="#A32D2D">4</text>
  <text x="200" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">root 一个人干 4 份活，root 网卡是瓶颈</text>

  <text x="20" y="184" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3B6D11">树形广播：已收到的进程同时转发，O(log N)</text>
  <circle cx="70" cy="212" r="15" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="70" y="212" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">root</text>
  <circle cx="160" cy="212" r="15" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="160" y="212" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">P1</text>
  <circle cx="70" cy="278" r="15" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="70" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">P2</text>
  <circle cx="160" cy="278" r="15" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="160" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">P3</text>
  <circle cx="250" cy="278" r="15" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="250" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">P4</text>
  <circle cx="340" cy="278" r="15" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">P5</text>
  <path d="M85 212 L145 212" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/><text x="115" y="202" font-family="sans-serif" font-size="10" fill="#3B6D11">轮1</text>
  <path d="M70 227 L70 263" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M148 223 L82 265" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/><text x="120" y="250" font-family="sans-serif" font-size="10" fill="#3B6D11">轮2</text>
  <path d="M70 293 L70 300 L250 300 L250 293" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M160 293 L160 306 L340 306 L340 293" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/><text x="200" y="322" font-family="sans-serif" font-size="10" fill="#3B6D11">轮3</text>
  <text x="380" y="240" font-family="sans-serif" font-size="12" fill="#888780">3 轮覆盖 8 个进程</text>
  <text x="380" y="262" font-family="sans-serif" font-size="12" fill="#888780">1000 进程也只要 10 轮</text>

  <text x="20" y="356" font-family="sans-serif" font-size="13" font-weight="bold" fill="#185FA5">树形归约：同一棵树倒过来走</text>
  <rect x="40" y="368" width="80" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="80" y="381" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">0.52</text>
  <rect x="140" y="368" width="80" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="180" y="381" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">0.48</text>
  <rect x="240" y="368" width="80" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="280" y="381" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">0.61</text>
  <rect x="340" y="368" width="80" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="380" y="381" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">0.39</text>
  <path d="M80 394 L80 408 L150 408 L150 400" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M280 394 L280 412 L310 412 L310 400" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="120" y="400" width="80" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="160" y="413" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#042C53">1.00</text>
  <rect x="290" y="400" width="80" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="330" y="413" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#042C53">1.00</text>
  <path d="M160 426 L160 436 L230 436" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M330 426 L330 436 L260 436" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="470" y="396" font-family="sans-serif" font-size="12" fill="#888780">半路上就把数加掉</text>
  <text x="470" y="416" font-family="sans-serif" font-size="12" fill="#888780">N 个数只需 log₂N 轮</text>
</svg>
