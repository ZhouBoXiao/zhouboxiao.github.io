<svg viewBox="0 0 600 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alltoall 矩阵转置">
  <title>MPI_Alltoall 的矩阵转置视角</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">调用前：每人持有第 i 行</text>
  <text x="40" y="52" font-family="sans-serif" font-size="11" fill="#5F5E5A">发给谁 →</text>
  <rect x="40" y="60" width="66" height="24" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="73" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">0→0</text>
  <rect x="106" y="60" width="66" height="24" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="139" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">0→1</text>
  <rect x="172" y="60" width="66" height="24" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="205" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">0→2</text>
  <rect x="40" y="84" width="66" height="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="73" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">1→0</text>
  <rect x="106" y="84" width="66" height="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="139" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">1→1</text>
  <rect x="172" y="84" width="66" height="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="205" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">1→2</text>
  <rect x="40" y="108" width="66" height="24" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="73" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">2→0</text>
  <rect x="106" y="108" width="66" height="24" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="139" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">2→1</text>
  <rect x="172" y="108" width="66" height="24" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="205" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">2→2</text>
  <text x="22" y="72" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">行0</text>
  <text x="22" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">行1</text>
  <text x="22" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">行2</text>
  <path d="M255 96 L330 96" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="292" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">转置</text>
  <text x="480" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3B6D11">调用后：每人持有第 j 列</text>
  <rect x="345" y="60" width="66" height="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="378" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">0→0</text>
  <rect x="345" y="84" width="66" height="24" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="378" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">1→0</text>
  <rect x="345" y="108" width="66" height="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="378" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">2→0</text>
  <rect x="430" y="60" width="66" height="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="463" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">0→1</text>
  <rect x="430" y="84" width="66" height="24" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="463" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">1→1</text>
  <rect x="430" y="108" width="66" height="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="463" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">2→1</text>
  <rect x="515" y="60" width="66" height="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="548" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">0→2</text>
  <rect x="515" y="84" width="66" height="24" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="548" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">1→2</text>
  <rect x="515" y="108" width="66" height="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="548" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#173404">2→2</text>
  <text x="378" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">P0 收到</text>
  <text x="463" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">P1 收到</text>
  <text x="548" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">P2 收到</text>
  <rect x="40" y="180" width="520" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="300" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">每个格子只移动一次，无中转、无复制 —— 但每个进程要发 N 条、收 N 条</text>
  <text x="300" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">消息数 N² 级，是集合通信里最"贵"的一个</text>
  <text x="300" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">典型场景：矩阵转置、FFT 蝶形网络、并行快排的数据重分布</text>
  <text x="300" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">MoE 专家并行：token 按路由结果 dispatch 到各卡 —— 就是不等长的 Alltoallv</text>
</svg>
