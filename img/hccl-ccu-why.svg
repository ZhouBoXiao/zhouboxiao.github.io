<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-label="三代通信引擎的下发往返阶梯">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 11.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.3; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="404" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">三代引擎：被消掉的到底是哪些往返</text>
  <text class="ts" x="30" y="50">同一个算子，拆单动作不断往注册期前移；红色虚线是被后续架构消掉的部分</text>

  <!-- HOST -->
  <rect x="30" y="64" width="660" height="98" rx="10" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text class="bd" x="46" y="86">HOST / CPU_TS</text>
  <text class="ts" x="46" y="108">host 逐条下发几百个 task</text>
  <text class="ts" x="46" y="128" style="fill:#9F1239;">host bound</text>
  <rect x="596" y="72" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text class="ts" x="636" y="86" text-anchor="middle" style="fill:#9F1239;">几百次往返</text>
  <path class="arrg" d="M270 112 L296 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M320 112 L346 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M370 112 L396 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M420 112 L446 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M470 112 L496 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M520 112 L546 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M570 112 L596 112" marker-end="url(#m2)"/>
  <path class="arrg" d="M620 112 L646 112" marker-end="url(#m2)"/>
  <text class="ts" x="270" y="140">每个 2~5 μs，乘上几百次就是毫秒级纯提交开销</text>

  <!-- AICPU -->
  <rect x="30" y="170" width="660" height="98" rx="10" fill="#F2F7FF" stroke="rgba(75,63,227,0.24)"/>
  <text class="bd" x="46" y="192">AICPU_TS（+ BatchMode / Task Cache）</text>
  <text class="ts" x="46" y="214">host 只提交 1 个 kernel</text>
  <text class="ts" x="46" y="234">拆单下沉到 AI CPU</text>
  <rect x="596" y="178" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#6F6FFF"/>
  <text class="ts" x="636" y="192" text-anchor="middle" style="fill:#3F3A8C;">1 次交互</text>
  <path class="arr" d="M270 214 L326 214" marker-end="url(#m1)"/>
  <rect x="336" y="198" width="330" height="34" rx="7" fill="#FFFFFF" stroke="rgba(75,63,227,0.24)"/>
  <text class="ts" x="348" y="219">AI CPU 内部：拆单 → 攒批 → 提交 → 等 → 下一步 …</text>
  <path d="M336 246 L666 246" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <text class="ts" x="270" y="258" style="fill:#9F1239;">运行期仍要重新展开，缓存只能省掉重复的那部分</text>

  <!-- CCU -->
  <rect x="30" y="276" width="660" height="98" rx="10" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.4"/>
  <text class="bd" x="46" y="298">CCU</text>
  <text class="ts" x="46" y="320">拆单在注册期完成</text>
  <text class="ts" x="46" y="340">产物是微码，不是 task</text>
  <rect x="596" y="284" width="80" height="20" rx="10" fill="#4B3FE3"/>
  <text class="ts" x="636" y="298" text-anchor="middle" style="fill:#FFFFFF;">0 次软件往返</text>
  <path class="arr" d="M270 320 L326 320" marker-end="url(#m1)"/>
  <rect x="336" y="304" width="330" height="34" rx="7" fill="#FFFFFF" stroke="rgba(75,63,227,0.4)"/>
  <text class="ts" x="348" y="325">CCU 取指：分支 / 循环 / 同步 / 搬运全在硬件里跑完</text>
  <text class="ts" x="270" y="360" style="fill:#3F3A8C;">指令常驻 1MB 指令空间，运行期只发一个带 instStartId 的 task</text>

  <rect x="30" y="382" width="660" height="18" rx="6" fill="#F2F7FF"/>
  <text class="ts" x="42" y="395" style="fill:#3F3A8C;">HOST 砍的是 host 侧交互，AICPU 砍的是交互次数，CCU 砍的是「运行期还要展开」这件事本身</text>
</svg>
