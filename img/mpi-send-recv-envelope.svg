<svg viewBox="0 0 600 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MPI Send Recv 消息信封">
  <title>MPI_Send / MPI_Recv 的消息信封与匹配规则</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="50" width="140" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="90" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">rank 0（发件人）</text>
  <text x="90" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">number = -1</text>
  <text x="90" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#185FA5">MPI_Send(...)</text>
  <rect x="220" y="40" width="160" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="300" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#633806">信封</text>
  <text x="300" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">数据：1 个 MPI_INT</text>
  <text x="300" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">目的地：rank 1</text>
  <text x="300" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">标签 tag = 0</text>
  <text x="300" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">通信域：WORLD</text>
  <rect x="440" y="50" width="140" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="510" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">rank 1（收件人）</text>
  <text x="510" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">number = ?</text>
  <text x="510" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#185FA5">MPI_Recv(...) 等待中</text>
  <path d="M160 85 L220 85" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380 85 L440 85" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="160" width="560" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="300" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">Recv 声明的 (source, tag) 必须与 Send 写的 (dest, tag) 同时匹配</text>
  <text x="300" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">放宽匹配：source 填 MPI_ANY_SOURCE、tag 填 MPI_ANY_TAG</text>
  <text x="300" y="236" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Send 返回 ≠ 对方已收到，只表示发送缓冲区可复用；大消息可能直接阻塞</text>
  <text x="300" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Recv 是阻塞的：匹配的消息不到，进程就停在这里</text>
</svg>
