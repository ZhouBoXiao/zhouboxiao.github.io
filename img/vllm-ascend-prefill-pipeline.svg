  <text class="ts" x="484" y="400" text-anchor="middle">三角因果掩码</text>
  <path class="arr" d="M348 406 L348 420" marker-end="url(#a)"/>

  <rect class="node" x="128" y="424" width="440" height="60" rx="8"/>
  <text class="th" x="348" y="448" text-anchor="middle">K / V 按块表写入物理块</text>
  <text class="ts" x="348" y="468" text-anchor="middle">16 token 一块 · 写满申请新块 · 落在 910B HBM</text>
  <path class="arr" d="M348 484 L348 498" marker-end="url(#a)"/>

  <rect class="node" x="128" y="502" width="440" height="60" rx="8"/>
  <text class="th" x="348" y="526" text-anchor="middle">FFN · gate / up / down 投影</text>
  <text class="ts" x="348" y="546" text-anchor="middle">每个位置独立 · 又一批大 GEMM</text>
  <path class="arr" d="M572 532 C600 532 600 230 572 230" marker-end="url(#a)"/>
  <path class="arr" d="M348 586 L348 600" marker-end="url(#a)"/>

  <rect class="node-brand" x="88" y="604" width="520" height="84" rx="8"/>
  <text class="th brand-t" x="348" y="628" text-anchor="middle">出口 · 只取最后一个位置</text>
  <text class="ts brand-t" x="348" y="648" text-anchor="middle">末位置隐状态 → logits → 采样出第 1 个生成 token</text>
  <text class="ts brand-t" x="348" y="666" text-anchor="middle">其余位置的输出直接丢弃 —— 价值全沉淀在已写入的 KV 里</text>

  <rect class="strip" x="40" y="704" width="640" height="60" rx="12"/>
  <text class="tb" x="60" y="726">组批：多个 prompt 拼一次 batch · 各带各的 Block Table · 前缀缓存命中只算后缀</text>
  <text class="ts" x="60" y="746">chunked prefill：长 prompt 切块逐次执行 · 后块的注意力要读前块已写入的 KV</text>
</svg>