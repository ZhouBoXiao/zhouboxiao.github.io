  <text class="tw" x="463" y="55" text-anchor="middle">t6</text>
  <rect class="tok" x="490" y="36" width="38" height="28" rx="5"/>
  <text class="tw" x="509" y="55" text-anchor="middle">t7</text>
  <path class="arr" d="M348 68 L348 82" marker-end="url(#a)"/>

  <rect class="node" x="168" y="86" width="360" height="48" rx="8"/>
  <text class="th" x="348" y="106" text-anchor="middle">Embedding 查表 + RoPE 位置编码</text>
  <text class="ts" x="348" y="124" text-anchor="middle">token id → 向量 · 位置编码只加在 Q / K 上</text>
  <path class="arr" d="M348 134 L348 152" marker-end="url(#a)"/>

  <rect class="loop" x="88" y="156" width="520" height="430" rx="12"/>
  <text class="th" x="108" y="182">Transformer 层 × N（LLaMA-7B 为 32 层）</text>

  <rect class="node" x="128" y="200" width="440" height="60" rx="8"/>
  <text class="th" x="348" y="224" text-anchor="middle">QKV 投影 · 大 GEMM</text>
  <text class="ts" x="348" y="244" text-anchor="middle">所有位置并行 · 每个位置各得一份 q / k / v —— prefill 算力大头</text>
  <path class="arr" d="M348 260 L348 274" marker-end="url(#a)"/>

  <rect class="node" x="128" y="278" width="440" height="128" rx="8"/>
  <text class="th" x="152" y="302">因果自注意力 · flash 融合算子</text>
  <text class="ts" x="152" y="322">Q·Kᵀ → softmax → ·V · 分块计算</text>
  <text class="ts" x="152" y="338">从不物化 L×L 注意力矩阵</text>
  <text class="ts" x="152" y="358">GQA：多个 Q 头共享一组 K / V</text>
  <text class="ts" x="152" y="378">位置 i 只与 0..i 做注意力</text>
