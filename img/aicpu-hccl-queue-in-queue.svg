<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="780" height="440" fill="#fbfbfd"/>
  <text x="390" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">HCCL 队列套队列：Host 如何调用 AICPU</text>

  <g font-size="15" fill="#1e293b" text-anchor="middle">
    <rect x="240" y="56" width="300" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="82">Host（Runtime）</text>
    <text x="390" y="104" font-size="12" fill="#6d28d9">下发 SQE（控制面 kernel / 算子任务）</text>

    <rect x="170" y="178" width="440" height="74" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="390" y="206">AICPU（Device 侧，通信算子在此展开执行）</text>
    <text x="390" y="228" font-size="12" fill="#0369a1">HCCL_OP_EXPANSION_MODE = AI_CPU（默认）</text>
    <text x="390" y="246" font-size="12" fill="#0369a1">展开数据面操作 → 构造 WQE → 敲 Doorbell</text>

    <rect x="240" y="320" width="300" height="62" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="390" y="346">RoCE DMA Engine / SDMA</text>
    <text x="390" y="368" font-size="12" fill="#15803d">真正的 HBM↔HBM 搬运；执行完写回 CQE</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M390 118 V175"/>
    <path d="M390 252 V317"/>
  </g>
  <!-- CQE return -->
  <path d="M595 351 C700 351, 700 140, 540 124" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arR)"/>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>

  <!-- queue-in-queue annotation -->
  <g>
    <rect x="40" y="178" width="110" height="74" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="95" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">队列套队列</text>
    <text x="95" y="220" text-anchor="middle" font-size="11" fill="#9a3412">入口 SQE</text>
    <text x="95" y="236" text-anchor="middle" font-size="11" fill="#9a3412">出口 WQE+DB</text>
    <text x="95" y="252" text-anchor="middle" font-size="11" fill="#9a3412">回执 CQE</text>
  </g>

  <text x="390" y="420" text-anchor="middle" font-size="13" fill="#64748b">卡间 HCCS 直拷走 SDMA 任务；Host↔Device 走 PCIe 拷贝，都不下钻成 WQE</text>
</svg>
