<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="级联捕获流形成的双向链表与触发条件">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4B3FE3"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#B45309"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#A1A1AA"/>
    </marker>
  </defs>
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  </style>
  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">级联流：一条链子接一条链子</text>
  <text class="ts" x="30" y="50">SQ 装满了就挂一条新的上来，任务组跟着搬家</text>

  <!-- 触发条件 -->
  <rect x="36" y="66" width="648" height="94" rx="8" fill="#F7F7F8"/>
  <text class="ts" x="48" y="86" style="fill:#71717A;">NeedCascadeExpandStream（task_david.cc:287）</text>
  <text class="mono" x="48" y="108" style="font-size:9.5px;">taskResMang_ != nullptr：GetResTail() + 32 &gt;= GetSqDepth()</text>
  <text class="mono" x="48" y="124" style="font-size:9.5px;">taskResMang_ == nullptr：GetCaptureSqeNum() + 32 + rsvTaskNum &gt;= GetSqDepth()</text>
  <text class="ts" x="48" y="148" style="fill:#B45309;">留 32 个空位（CAPTURE_TASK_RESERVED_NUM）给 EndGraph、LoadComplete 这些收尾 SQE</text>

  <!-- 链表 -->
  <text class="ts" x="40" y="190" style="fill:#71717A;">捕获流链表</text>

  <rect x="36" y="200" width="182" height="96" rx="8" fill="#F2F7FF" stroke="rgba(75,63,227,0.35)"/>
  <text class="bd" x="50" y="220">orig capture stream</text>
  <text class="ts" x="50" y="238" style="fill:#71717A;">isOrigCaptureStream_ = true</text>
  <text class="ts" x="50" y="256" style="fill:#71717A;">isLastLevel = false（已不是末级）</text>
  <text class="ts" x="50" y="276" style="fill:#3F3A8C;">BeginCapture 那条流</text>

  <rect x="266" y="200" width="182" height="96" rx="8" fill="#F2F7FF" stroke="rgba(75,63,227,0.35)"/>
  <text class="bd" x="280" y="220">cascade stream #1</text>
  <text class="ts" x="280" y="238" style="fill:#71717A;">继承 orig 身份</text>
  <text class="ts" x="280" y="256" style="fill:#71717A;">isLastLevel = false</text>
  <text class="ts" x="280" y="276" style="fill:#3F3A8C;">第二段，也满了</text>

  <rect x="496" y="200" width="184" height="96" rx="8" fill="#F2F7FF" stroke="rgba(75,63,227,0.55)" stroke-width="1.4"/>
  <text class="bd" x="510" y="220">cascade stream #2</text>
  <text class="ts" x="510" y="238" style="fill:#71717A;">isLastLevel = true</text>
  <text class="ts" x="510" y="256" style="fill:#71717A;">当前正在往里写</text>
  <text class="ts" x="510" y="276" style="fill:#3F3A8C;">末级，stm 指向它</text>

  <!-- child 指针：向右 -->
  <path d="M218 232 L262 232" stroke="#4B3FE3" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M448 232 L492 232" stroke="#4B3FE3" stroke-width="1.3" marker-end="url(#a)"/>
  <text class="ts" x="222" y="224" style="fill:#3F3A8C;font-size:9.5px;">child</text>
  <text class="ts" x="452" y="224" style="fill:#3F3A8C;font-size:9.5px;">child</text>

  <!-- parent 指针：向左 -->
  <path d="M262 268 L222 268" stroke="#A1A1AA" stroke-width="1.2" marker-end="url(#ag)"/>
  <path d="M492 268 L452 268" stroke="#A1A1AA" stroke-width="1.2" marker-end="url(#ag)"/>
  <text class="ts" x="222" y="290" style="fill:#71717A;font-size:9.5px;">parent</text>
  <text class="ts" x="452" y="290" style="fill:#71717A;font-size:9.5px;">parent</text>

  <!-- 唯一的真下发 -->
  <text class="ts" x="40" y="330" style="fill:#71717A;">每次换流，链上要插一个真任务</text>
  <rect x="36" y="340" width="648" height="62" rx="8" fill="#FFF7ED" stroke="rgba(180,83,9,0.30)"/>
  <text class="bd" x="48" y="362" style="fill:#B45309;">CondStreamActive(newCaptureStream, curCaptureStream)</text>
  <text class="ts" x="48" y="382" style="fill:#B45309;">构造一个 StreamActive 任务真的提交下去 —— 捕获期间唯一不截流的地方</text>
  <text class="ts" x="48" y="396" style="fill:#71717A;">不插这个，两段在执行时并行跑，先后顺序就丢了</text>

  <!-- 底条 -->
  <rect x="36" y="416" width="648" height="42" rx="6" fill="#F7F7F8"/>
  <text class="ts" x="48" y="434" style="fill:#3F3A8C;">一条流最多 32768 个 SQE（STREAM_SQ_MAX_DEPTH），再多的任务只能靠级联</text>
  <text class="ts" x="48" y="450" style="fill:#71717A;">级联没有层数上限，但每多一级就多一条流、多一份 SQ/CQ 配额（总共 1024）</text>
</svg>
