<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="CondHandle 的组成、父子图关系与条件任务 SQE 布局">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4B3FE3"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#A1A1AA"/>
    </marker>
  </defs>
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  </style>
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">条件控制流：一个条件值，一组分支，一个共享 Notify</text>
  <text class="ts" x="30" y="50">图里能有分支和循环，靠的是 CondHandle 这一个对象</text>

  <!-- 父图 -->
  <rect x="36" y="70" width="180" height="72" rx="7" fill="#F2F7FF" stroke="rgba(75,63,227,0.40)"/>
  <text class="bd" x="48" y="92">父 CaptureModel</text>
  <text class="ts" x="48" y="110" style="fill:#71717A;">根模型，READY 才能执行</text>
  <text class="ts" x="48" y="128" style="fill:#3F3A8C;">持有 condHandles_ 列表</text>

  <!-- CondHandle -->
  <rect x="258" y="64" width="196" height="164" rx="8" fill="#FFFFFF" stroke="rgba(75,63,227,0.45)" stroke-width="1.4"/>
  <text class="bd" x="270" y="86">CondHandle</text>
  <path d="M270 94 L442 94" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text class="mono" x="270" y="112" style="font-size:9px;fill:#B45309;">devAddr_ (uint64_t*)</text>
  <text class="ts" x="270" y="126" style="fill:#71717A;">device 侧条件值</text>

  <text class="mono" x="270" y="146" style="font-size:9px;fill:#B45309;">defaultValue_ (uint64_t*)</text>
  <text class="ts" x="270" y="160" style="fill:#71717A;">host 侧，异步拷贝的源</text>

  <text class="mono" x="270" y="180" style="font-size:9px;">subCaptureModels_</text>
  <text class="ts" x="270" y="194" style="fill:#71717A;">分支子图列表</text>

  <text class="mono" x="270" y="214" style="font-size:9px;">subModelNotify_</text>

  <!-- 子图 -->
  <rect x="496" y="56" width="186" height="60" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.16)"/>
  <text class="bd" x="508" y="76">子图 #0</text>
  <text class="ts" x="508" y="94" style="fill:#71717A;">IF 成立时执行</text>
  <text class="ts" x="508" y="110" style="fill:#71717A;">isSubCaptureModel_ = true</text>

  <rect x="496" y="128" width="186" height="60" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.16)"/>
  <text class="bd" x="508" y="148">子图 #1</text>
  <text class="ts" x="508" y="166" style="fill:#71717A;">IF 不成立时执行</text>
  <text class="ts" x="508" y="182" style="fill:#71717A;">执行流固定为父捕获流</text>

  <rect x="496" y="200" width="186" height="34" rx="6" fill="#FFF7ED" stroke="rgba(180,83,9,0.28)"/>
  <text class="ts" x="508" y="222" style="fill:#B45309;">所有分支共用一个 Notify</text>

  <path d="M216 106 L254 106" stroke="#4B3FE3" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M454 100 L492 86" stroke="#4B3FE3" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M454 140 L492 154" stroke="#4B3FE3" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M454 214 L492 217" stroke="#B45309" stroke-width="1.2"/>

  <text class="ts" x="40" y="258" style="fill:#71717A;">为什么能共用一个 Notify：任一时刻只有一个分支在跑，互斥就够了</text>

  <!-- 条件任务 SQE -->
  <text class="ts" x="40" y="292" style="fill:#71717A;">一个条件任务占几个 SQE（aclgraph_cond_task.h:20）</text>
  <path d="M40 298 L684 298" stroke="rgba(23,23,23,0.14)" stroke-width="1"/>

  <!-- IF/SWITCH -->
  <rect x="36" y="306" width="318" height="98" rx="7" fill="#F2F7FF"/>
  <text class="bd" x="48" y="326">IF / SWITCH — 2 个 SQE</text>
  <rect x="48" y="336" width="128" height="26" rx="4" fill="#FFFFFF" stroke="rgba(75,63,227,0.30)"/>
  <text class="mono" x="56" y="353" style="font-size:9px;">SQE[0] CondFirst</text>
  <rect x="184" y="336" width="156" height="26" rx="4" fill="#FFFFFF" stroke="rgba(75,63,227,0.30)"/>
  <text class="mono" x="192" y="353" style="font-size:9px;">SQE[1] NotifyWait</text>
  <text class="ts" x="48" y="382" style="fill:#71717A;">CondFirst 是条件判断 FunctionCall</text>
  <text class="ts" x="48" y="398" style="fill:#71717A;">NotifyWait 等分支子图完成</text>

  <!-- WHILE -->
  <rect x="366" y="306" width="318" height="98" rx="7" fill="#F7F7F8"/>
  <text class="bd" x="378" y="326">WHILE — 3 个 SQE</text>
  <rect x="378" y="336" width="96" height="26" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="384" y="353" style="font-size:9px;">CondFirst</text>
  <rect x="480" y="336" width="90" height="26" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="486" y="353" style="font-size:9px;">NotifyWait</text>
  <rect x="576" y="336" width="96" height="26" rx="4" fill="#FFF7ED" stroke="rgba(180,83,9,0.35)"/>
  <text class="mono" x="582" y="353" style="font-size:9px;fill:#B45309;">JumpBack</text>
  <text class="ts" x="378" y="382" style="fill:#B45309;">多出来的那个是回边 —— 循环必须有，分支不需要</text>
  <text class="ts" x="378" y="398" style="fill:#71717A;">TASK_NUM 与 SQE_NUM 是两套常量，现在恰好相等</text>

  <!-- 32 字节 -->
  <rect x="36" y="418" width="648" height="46" rx="7" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ts" x="48" y="438" style="fill:#1A1759;">COND_TASK_RESV_LEN_FOR_COND_EXECUTE = 32 字节，装三个地址：</text>
  <text class="mono" x="48" y="456" style="font-size:9.5px;fill:#52525B;">headSqArrAddr · headSqArrMax · streamSvmArrAddr</text>
  <text class="ts" x="440" y="456" style="fill:#71717A;">条件成立时硬件要知道往哪跳</text>

  <!-- 底条 -->
  <rect x="36" y="476" width="648" height="34" rx="6" fill="#F2F7FF"/>
  <text class="ts" x="48" y="497" style="fill:#3F3A8C;">defaultValue_ 是 uint64_t* 不是 uint64_t —— 异步拷贝的源必须活得比调用久</text>
</svg>
