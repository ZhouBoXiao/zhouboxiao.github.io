<svg viewBox="0 0 600 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MPI 集合通信四种数据流">
  <title>MPI 集合通信四种数据流：Bcast / Scatter / Gather / Alltoall</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">Bcast：root 发同一份给所有人</text>
  <circle cx="60" cy="72" r="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="60" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">root</text>
  <circle cx="200" cy="72" r="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="200" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">P1</text>
  <circle cx="260" cy="72" r="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="260" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">P2</text>
  <circle cx="320" cy="72" r="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="320" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">P3</text>
  <path d="M78 70 L184 71" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M78 74 L244 73" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M78 78 L304 78" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="360" y="76" font-family="sans-serif" font-size="12" fill="#888780">内容相同，人人一份</text>

  <text x="20" y="126" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">Scatter：root 切片分发</text>
  <rect x="40" y="140" width="120" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <rect x="42" y="142" width="38" height="22" fill="#B5D4F4"/><text x="61" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">片0</text>
  <rect x="81" y="142" width="38" height="22" fill="#B5D4F4"/><text x="100" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">片1</text>
  <rect x="120" y="142" width="38" height="22" fill="#B5D4F4"/><text x="139" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">片2</text>
  <rect x="200" y="140" width="52" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="226" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">片0</text>
  <rect x="260" y="140" width="52" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="286" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">片1</text>
  <rect x="320" y="140" width="52" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="346" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">片2</text>
  <path d="M61 166 L226 170" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M100 166 L282 170" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M139 166 L342 170" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="400" y="158" font-family="sans-serif" font-size="12" fill="#888780">每人拿到不同的一段</text>

  <text x="20" y="212" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">Gather：归堆到 root</text>
  <rect x="40" y="226" width="52" height="26" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="66" y="241" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">局部值</text>
  <rect x="100" y="226" width="52" height="26" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="126" y="241" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">局部值</text>
  <rect x="160" y="226" width="52" height="26" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="186" y="241" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#27500A">局部值</text>
  <rect x="260" y="226" width="120" height="26" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
  <text x="320" y="241" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#173404">root 汇总全部</text>
  <path d="M92 226 L262 234" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M152 226 L268 240" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M212 226 L274 246" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="400" y="242" font-family="sans-serif" font-size="12" fill="#888780">结果只在 root 手里</text>

  <text x="20" y="298" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">Alltoall：全交换（矩阵转置）</text>
  <rect x="40" y="312" width="52" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="66" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#633806">发给0</text>
  <rect x="100" y="312" width="52" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="126" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#633806">发给1</text>
  <rect x="160" y="312" width="52" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="186" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#633806">发给2</text>
  <rect x="260" y="312" width="52" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><text x="286" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#412402">来自0</text>
  <rect x="320" y="312" width="52" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><text x="346" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#412402">来自1</text>
  <rect x="380" y="312" width="52" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><text x="406" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#412402">来自2</text>
  <path d="M66 338 L280 344" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M126 338 L344 344" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M186 338 L404 344" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="450" y="330" font-family="sans-serif" font-size="12" fill="#888780">N² 通信量，最贵</text>
</svg>
