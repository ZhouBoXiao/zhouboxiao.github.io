<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 544" width="720" height="544" role="img" aria-label="vLLM-Ascend 生态分层全景图">
  <style>
    .t { fill: #171717; font: 400 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .lay { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
    .lay-brand { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 1.6; }
    .lay-ext { fill: none; stroke: #52525B; stroke-dasharray: 6 6; }
    .nblk { fill: #FFFFFF; stroke: rgba(23,23,23,0.12); }
    .bblk { fill: #FFFFFF; stroke: #4B3FE3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="544" fill="#FFFFFF"/>

  <rect class="lay" x="48" y="40" width="624" height="78" rx="12"/>
  <text class="ts" x="68" y="62">应用层</text>
  <rect class="nblk" x="68" y="78" width="150" height="34" rx="8"/>
  <text class="t" x="143" y="99" text-anchor="middle">OpenAI 兼容 API</text>
  <rect class="nblk" x="242" y="78" width="150" height="34" rx="8"/>
  <text class="t" x="317" y="99" text-anchor="middle">离线推理 / 评测</text>

  <rect class="lay" x="48" y="138" width="624" height="78" rx="12"/>
  <text class="ts" x="68" y="160">vLLM 引擎核心 · 设备无关</text>
  <rect class="nblk" x="68" y="176" width="140" height="34" rx="8"/>
  <text class="t" x="138" y="197" text-anchor="middle">连续批处理调度</text>
  <rect class="nblk" x="232" y="176" width="160" height="34" rx="8"/>
  <text class="t" x="312" y="197" text-anchor="middle">PagedAttention 缓存</text>
  <rect class="nblk" x="416" y="176" width="150" height="34" rx="8"/>
  <text class="t" x="491" y="197" text-anchor="middle">采样 · 结构化输出</text>

  <rect class="lay-brand" x="48" y="236" width="624" height="78" rx="12"/>
  <text class="ts" x="68" y="258" style="fill:#1A1759;">vllm-ascend 插件</text>
  <rect x="544" y="246" width="112" height="22" rx="11" fill="#FFFFFF" stroke="#4B3FE3"/>
  <text class="ts" x="600" y="261" text-anchor="middle" style="fill:#4B3FE3; font-weight:500;">本篇主角</text>
  <rect class="bblk" x="68" y="274" width="104" height="34" rx="8"/>
  <text class="t" x="120" y="295" text-anchor="middle">Platform</text>
  <rect class="bblk" x="192" y="274" width="136" height="34" rx="8"/>
  <text class="t" x="260" y="295" text-anchor="middle">Worker · Runner</text>
  <rect class="bblk" x="348" y="274" width="136" height="34" rx="8"/>
  <text class="t" x="416" y="295" text-anchor="middle">Attention 后端</text>
  <rect class="bblk" x="504" y="274" width="120" height="34" rx="8"/>
  <text class="t" x="564" y="295" text-anchor="middle">量化 · 通信</text>

  <rect class="lay" x="48" y="334" width="624" height="78" rx="12"/>
  <text class="ts" x="68" y="356">昇腾软件栈</text>
  <rect class="nblk" x="68" y="372" width="110" height="34" rx="8"/>
  <text class="t" x="123" y="393" text-anchor="middle">torch_npu</text>
  <rect class="nblk" x="202" y="372" width="150" height="34" rx="8"/>
  <text class="t" x="277" y="393" text-anchor="middle">CANN · ATB 算子</text>
  <rect class="nblk" x="376" y="372" width="110" height="34" rx="8"/>
  <text class="t" x="431" y="393" text-anchor="middle">HCCL 通信</text>

  <rect class="lay-ext" x="48" y="432" width="624" height="78" rx="12"/>
  <text class="ts" x="68" y="454">昇腾硬件</text>
  <rect class="nblk" x="230" y="470" width="260" height="30" rx="8"/>
  <text class="t" x="360" y="490" text-anchor="middle">Atlas 800 · 昇腾 910B NPU × 8</text>

  <path class="arr" d="M360 121 L360 133" marker-end="url(#a)"/>
  <path class="arr" d="M360 219 L360 231" marker-end="url(#a)"/>
  <path class="arr" d="M360 317 L360 329" marker-end="url(#a)"/>
  <path class="arr" d="M360 415 L360 427" marker-end="url(#a)"/>
</svg>
