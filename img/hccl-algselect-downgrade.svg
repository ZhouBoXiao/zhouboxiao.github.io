<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-label="引擎降级链：GetEnginePriority 与 selector 内部的逐级下沉">
  <style>
    .tb { fill: #171717; font: 500 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .nt { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ns { fill: #52525B; font: 400 10px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #1A1759; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .lv { fill: #FFFFFF; font: 500 11.5px "SF Mono", Consolas, monospace; text-anchor: middle; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.4; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="g1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="404" fill="#FFFFFF"/>
  <text class="tb" x="30" y="28">选不上就往下掉：引擎的降级链</text>
  <text class="ts" x="30" y="48">没有哪个算法是「必须可用」的 —— 除了 AIV_ONLY 那条</text>

  <!-- 左：漏斗 -->
  <text class="nt" x="30" y="80">起始模式 CCU_MS 的候选链</text>

  <rect x="30" y="94" width="300" height="38" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="lv" x="180" y="118" style="fill:#1A1759;">CCU_MS</text>
  <path class="arr" d="M180 132 L180 142" marker-end="url(#g1)"/>

  <rect x="50" y="146" width="260" height="38" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="lv" x="180" y="170" style="fill:#1A1759;">CCU_SCHED</text>
  <path class="arr" d="M180 184 L180 194" marker-end="url(#g1)"/>

  <rect x="70" y="198" width="220" height="38" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="lv" x="180" y="222" style="fill:#1A1759;">AICPU_TS</text>
  <path class="arr" d="M180 236 L180 246" marker-end="url(#g1)"/>

  <rect x="90" y="250" width="180" height="38" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="lv" x="180" y="274" style="fill:#1A1759;">HOSTCPU</text>

  <text class="ns" x="30" y="310">每一层自己判定「我能不能接这一单」：拓扑不支持、</text>
  <text class="ns" x="30" y="326">rankSize 超上限、数据类型不支持…… 都返回 NOT_MATCH。</text>

  <!-- 右：优先级表 -->
  <text class="nt" x="370" y="80">GetEnginePriority：每种起始模式往哪掉</text>

  <rect x="370" y="92" width="320" height="26" rx="4" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="ns" x="382" y="109" style="fill:#171717;">起始模式</text>
  <text class="ns" x="540" y="109" style="fill:#171717;">候选链（按顺序尝试）</text>

  <rect x="370" y="120" width="320" height="24" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="382" y="136" style="fill:#171717;">CCU_MS</text>
  <text class="ns" x="540" y="136">CCU_MS → CCU_SCHED → AICPU_TS → HOSTCPU</text>

  <rect x="370" y="146" width="320" height="24" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="382" y="162" style="fill:#171717;">CCU_SCHED</text>
  <text class="ns" x="540" y="162">CCU_SCHED → AICPU_TS → HOSTCPU</text>

  <rect x="370" y="172" width="320" height="24" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="382" y="188" style="fill:#171717;">AIV</text>
  <text class="ns" x="540" y="188">AIV → AICPU_TS → HOSTCPU</text>

  <rect x="370" y="198" width="320" height="24" rx="4" fill="#FFF9EC" stroke="#E0A82E" stroke-width="1.2"/>
  <text class="mono" x="382" y="214" style="fill:#B45309;">AIV_ONLY</text>
  <text class="ns" x="540" y="214" style="fill:#B45309;">AIV（掉不下去，失败即报错）</text>

  <rect x="370" y="224" width="320" height="24" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="382" y="240" style="fill:#171717;">AICPU_TS</text>
  <text class="ns" x="540" y="240">AICPU_TS → HOSTCPU</text>

  <rect x="370" y="250" width="320" height="24" rx="4" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="382" y="266" style="fill:#171717;">HOSTCPU / 其他</text>
  <text class="ns" x="540" y="266">HOSTCPU / AICPU_TS → HOSTCPU</text>

  <text class="ns" x="370" y="298">来源：selector_engine.cc:82</text>

  <rect x="30" y="342" width="660" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text class="ns" x="44" y="360" style="fill:#B91C1C;">AIV_ONLY 是唯一「不许降级」的模式：Conditional 不成立就直接在 SelectMinCost 报 HCCL_E_NOT_SUPPORT，</text>
  <text class="ns" x="44" y="376" style="fill:#B91C1C;">并把每个 AIV 算法被过滤的原因逐条打出来（LogAivOnlyNotMatch）。它是给「必须跑 AIV」的调试场景用的，不适合生产。</text>
</svg>
