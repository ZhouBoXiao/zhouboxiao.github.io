<svg viewBox="0 0 600 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="死锁与非阻塞修复对比">
  <title>全员先阻塞 Recv 导致死锁，Isend 打破依赖环</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A32D2D">坏写法：全员先阻塞 Recv —— 死锁</text>
  <rect x="40" y="38" width="130" height="34" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="105" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">rank 0: Recv 等 N-1</text>
  <rect x="235" y="38" width="130" height="34" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="300" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">rank 1: Recv 等 0</text>
  <rect x="430" y="38" width="130" height="34" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="495" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">rank 2: Recv 等 1</text>
  <path d="M105 72 L105 96 L300 96 L300 72" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M300 72 L300 104 L495 104 L495 72" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M495 72 L495 112 L105 112 L105 72" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="300" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#A32D2D">等待构成闭环，没有任何 Send 会发生，时间在这里冻结</text>

  <text x="20" y="176" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3B6D11">修法：Isend 先把消息挂出去 —— 依赖环消失</text>
  <rect x="40" y="190" width="150" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="115" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#27500A">rank 0</text>
  <text x="115" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">Isend 立即返回</text>
  <rect x="225" y="190" width="150" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="300" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#27500A">rank 1</text>
  <text x="300" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">Irecv 挂单等待</text>
  <rect x="410" y="190" width="150" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="485" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#27500A">rank 0</text>
  <text x="485" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">Wait 确认完成</text>
  <path d="M190 220 L225 220" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M375 220 L410 220" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="268" width="560" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="300" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">陷阱：小消息可能被 MPI 缓冲"顺手"送达，坏程序有时也能跑通</text>
  <text x="300" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">死锁与否取决于消息大小与实现 —— 本机跑通 ≠ 正确</text>
</svg>
