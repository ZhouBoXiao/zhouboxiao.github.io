<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="aicpusd 的启动顺序与线程模型">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .step { fill: #171717; font: 400 11.5px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .n { fill: #FFFFFF; font: 500 9px "SF Mono", Consolas, monospace; }
    .box { fill: #FFFFFF; stroke: rgba(23,23,23,0.16); stroke-width: 1.1; }
  </style>
  <rect x="0" y="0" width="720" height="540" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#52525B"/>
    </marker>
  </defs>

  <text class="tb" x="30" y="30">aicpusd 不是库，是设备侧一个有 main 的进程（可执行名 aicpu_scheduler）</text>
  <text class="ts" x="30" y="50">11 步里有两个顺序不能换：拿权限必须早于宣布可用；干活的是 worker 不是主线程</text>

  <!-- 左：11 步 -->
  <rect x="30" y="64" width="420" height="400" rx="9" fill="#FFFFFF" stroke="rgba(23,23,23,0.12)"/>
  <text class="bd" x="48" y="88">main 的 11 步（execute/main.cpp:311）</text>

  <circle cx="56" cy="120" r="9" fill="#A1A1AA"/><text class="n" x="56" y="123" text-anchor="middle">1</text>
  <text class="step" x="78" y="124">解析启动参数（pid / deviceId / vfId / group）</text>

  <circle cx="56" cy="152" r="9" fill="#A1A1AA"/><text class="n" x="56" y="155" text-anchor="middle">2</text>
  <text class="step" x="78" y="156">日志分级（host / ccecpu / aicpu 三套独立）</text>

  <circle cx="56" cy="184" r="9" fill="#6F6FFF"/><text class="n" x="56" y="187" text-anchor="middle">3</text>
  <text class="step" x="78" y="188">AddToCgroup —— 调度器自己进 cgroup</text>

  <circle cx="56" cy="216" r="9" fill="#6F6FFF"/><text class="n" x="56" y="219" text-anchor="middle">4</text>
  <text class="step" x="78" y="220">AicpusdLastword —— 先建「最后离开」的对象</text>

  <circle cx="56" cy="248" r="9" fill="#A1A1AA"/><text class="n" x="56" y="251" text-anchor="middle">5</text>
  <text class="step" x="78" y="252">ProfilerAgentInit —— profiling 探针</text>

  <circle cx="56" cy="280" r="9" fill="#A1A1AA"/><text class="n" x="56" y="283" text-anchor="middle">6</text>
  <text class="step" x="78" y="284">InitEventMgr —— 事件管理</text>

  <circle cx="56" cy="312" r="9" fill="#A1A1AA"/><text class="n" x="56" y="315" text-anchor="middle">7</text>
  <text class="step" x="78" y="316">InitAICPUScheduler —— 初始化调度器本体</text>

  <circle cx="56" cy="344" r="9" fill="#4B3FE3"/><text class="n" x="56" y="347" text-anchor="middle">8</text>
  <text class="step" x="78" y="348" style="fill:#1A1759; font-weight:500;">AttachHostGroup —— 先拿到 mbuf 访问权限</text>

  <circle cx="56" cy="376" r="9" fill="#A1A1AA"/><text class="n" x="56" y="379" text-anchor="middle">9</text>
  <text class="step" x="78" y="380">SendPidQosMsgToTsd —— 报 QoS 等级</text>

  <circle cx="56" cy="408" r="9" fill="#A1A1AA"/><text class="n" x="56" y="411" text-anchor="middle">10</text>
  <text class="step" x="78" y="412">注册 4 个 TSD 事件回调</text>

  <circle cx="56" cy="440" r="9" fill="#4B3FE3"/><text class="n" x="56" y="443" text-anchor="middle">11</text>
  <text class="step" x="78" y="444" style="fill:#1A1759; font-weight:500;">StartupResponse —— 宣布可用，然后阻塞</text>

  <!-- 右：线程模型 -->
  <rect x="466" y="64" width="224" height="400" rx="9" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.3"/>
  <text class="bd" x="486" y="88">线程模型</text>

  <rect x="486" y="100" width="184" height="44" rx="5" class="box"/>
  <text class="mono" x="578" y="120" text-anchor="middle">main thread</text>
  <text class="ts" x="578" y="136" text-anchor="middle">阻塞等待退出</text>
  <text class="ts" x="486" y="164">不干活，只等停止信号</text>

  <path d="M486 176 L670 176" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text class="ts" x="486" y="196">worker 池：一核一线程，硬绑核</text>

  <rect x="486" y="208" width="184" height="34" rx="5" class="box"/>
  <text class="mono" x="578" y="230" text-anchor="middle">worker 0 → core 0</text>
  <rect x="486" y="248" width="184" height="34" rx="5" class="box"/>
  <text class="mono" x="578" y="270" text-anchor="middle">worker 1 → core 1</text>
  <text class="mono" x="578" y="304" text-anchor="middle" style="fill:#71717A;">...</text>
  <rect x="486" y="312" width="184" height="34" rx="5" class="box"/>
  <text class="mono" x="578" y="334" text-anchor="middle">worker N-1 → core N-1</text>

  <text class="ts" x="486" y="372" style="fill:#3F3A8C;">N = AI CPU 核数，没有超卖余地</text>
  <text class="ts" x="486" y="392">没有 AI CPU 核时：固定 2 个</text>
  <text class="mono" x="486" y="410" style="fill:#52525B;">NO_AICPU_WORKER_NUM = 2</text>

  <!-- 底部 -->
  <rect x="30" y="476" width="660" height="48" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.10)"/>
  <text class="ts" x="46" y="496">第 8 步必须在第 11 步之前：<tspan style="fill:#3F3A8C;">源码注释写明「先拿到访问 RTS 发来的 mbuf 的权限，再宣布成功」。</tspan></text>
  <text class="ts" x="46" y="514">否则 TSD 一收到 startup response 就开始转发，而 aicpusd 还没权限读——第一条任务必失败。</text>
</svg>
