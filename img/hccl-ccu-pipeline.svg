<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="CCU 的录制、翻译、驻留与启动链路">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 11.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.3; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">录制 → 翻译 → 驻留 → 启动</text>
  <text class="ts" x="30" y="50">上排只做一次，下排每次调用重复；中间那条线就是「展开」发生的位置</text>

  <!-- 注册期 -->
  <rect x="30" y="64" width="660" height="156" rx="10" fill="#F2F7FF" stroke="rgba(75,63,227,0.32)"/>
  <text class="bd" x="46" y="86">注册期 · Host 侧，一次性</text>
  <rect x="46" y="98" width="140" height="60" rx="8" fill="#FFFFFF" stroke="rgba(75,63,227,0.26)"/>
  <text class="th" x="60" y="120">① 跑一遍 kernel</text>
  <text class="ts" x="60" y="140">执行 kernelFunc</text>
  <rect x="200" y="98" width="140" height="60" rx="8" fill="#FFFFFF" stroke="rgba(75,63,227,0.26)"/>
  <text class="th" x="214" y="120">② 录制序列</text>
  <text class="ts" x="214" y="140">ccu::* 只记录</text>
  <rect x="354" y="98" width="140" height="60" rx="8" fill="#FFFFFF" stroke="rgba(75,63,227,0.26)"/>
  <text class="th" x="368" y="120">③ Translate</text>
  <text class="ts" x="368" y="140">翻成硬件微码</text>
  <rect x="508" y="98" width="166" height="60" rx="8" fill="#FFFFFF" stroke="rgba(75,63,227,0.26)"/>
  <text class="th" x="522" y="120">④ 写入指令空间</text>
  <text class="ts" x="522" y="140">1MB，常驻可复用</text>
  <path class="arr" d="M188 128 L198 128" marker-end="url(#m1)"/>
  <path class="arr" d="M342 128 L352 128" marker-end="url(#m1)"/>
  <path class="arr" d="M496 128 L506 128" marker-end="url(#m1)"/>
  <text class="ts" x="46" y="182">RegisterStart → Register → RegisterEnd；函数体内所有 ccu::* 接口一个字节都不搬</text>
  <text class="ts" x="46" y="204" style="fill:#3F3A8C;">kernelArgs 固化成微码立即数　|　taskArgs 经 LoadArg 在每次启动时装入寄存器</text>

  <!-- 分界 -->
  <path d="M30 234 L690 234" stroke="#4B3FE3" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <rect x="228" y="223" width="264" height="22" rx="11" fill="#FFFFFF" stroke="rgba(75,63,227,0.28)"/>
  <text class="ts" x="360" y="238" text-anchor="middle" style="fill:#3F3A8C;">展开在注册期完成，运行期不再发生</text>

  <!-- 运行期 -->
  <rect x="30" y="256" width="660" height="176" rx="10" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text class="bd" x="46" y="278">运行期 · 每次调用</text>

  <rect x="46" y="290" width="150" height="76" rx="8" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="th" x="60" y="312">Host 只发 1 个 task</text>
  <text class="mono" x="60" y="334">HcommCcuKernelLaunch</text>
  <text class="ts" x="60" y="354">同一句柄可重复启动</text>

  <rect x="226" y="290" width="210" height="76" rx="8" fill="#FFFFFF" stroke="rgba(75,63,227,0.3)"/>
  <text class="th" x="240" y="312">rtCcuTaskInfo_t</text>
  <text class="mono" x="240" y="332">dieId / missionId</text>
  <text class="mono" x="240" y="348">instStartId / instCnt</text>
  <text class="mono" x="240" y="362">args / argSize / timeout</text>

  <rect x="466" y="290" width="208" height="76" rx="8" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.3"/>
  <text class="th" x="480" y="312">CCU 硬件取指执行</text>
  <text class="ts" x="480" y="332">分支 / 循环 / 同步</text>
  <text class="ts" x="480" y="350">Loop 并发 + URMA 搬运</text>
  <text class="ts" x="480" y="364">CcuBuffer 片内归约</text>

  <path class="arr" d="M198 328 L224 328" marker-end="url(#m1)"/>
  <path class="arr" d="M438 328 L464 328" marker-end="url(#m1)"/>

  <text class="ts" x="46" y="390">instStartId + instCnt 是铁证：指令已躺在硬件里，launch 只是告诉它从第几行开始跑</text>
  <path d="M46 404 L674 404" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <text class="ts" x="46" y="422" style="fill:#9F1239;">红色虚线：AICPU 仍需在 device 内重复的那 N 步「下发 → 等完成」，在 CCU 上不存在</text>

  <rect x="30" y="440" width="660" height="22" rx="6" fill="#F2F7FF"/>
  <text class="ts" x="42" y="455" style="fill:#3F3A8C;">一次注册、多次启动：能变的只有 taskArgs 那十几个 64bit，算法结构在注册时定死</text>
</svg>
