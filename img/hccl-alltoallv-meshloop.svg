<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-label="AlltoAllV mesh 1D 一轮通信的 rank 取法与线程编排">
  <style>
    .tb { fill: #171717; font: 500 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .nt { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ns { fill: #52525B; font: 400 10px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .rk { fill: #171717; font: 600 12px "SF Mono", Consolas, monospace; text-anchor: middle; }
    .rk2 { fill: #FFFFFF; font: 600 12px "SF Mono", Consolas, monospace; text-anchor: middle; }
    .mono { fill: #1A1759; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .blk { fill: #171717; font: 500 10px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #2563EB; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arr2 { stroke: #D97706; stroke-width: 1.4; stroke-dasharray: 5 3; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="424" fill="#FFFFFF"/>
  <text class="tb" x="30" y="28">一轮就把 3 个远端 rank 全带上：左右对称取法</text>
  <text class="ts" x="30" y="48">4 卡、并发上限 16 时，concurrentSendRecvNum_ = min(16, 4−1) = 3，一轮就够了</text>

  <!-- 环形四卡 -->
  <circle cx="250" cy="150" r="78" fill="none" stroke="rgba(23,23,23,0.10)" stroke-width="1.4"/>

  <path class="arr" d="M250 72 A 78 78 0 0 1 328 150" marker-end="url(#m1)"/>
  <path class="arr" d="M250 72 A 78 78 0 0 0 172 150" marker-end="url(#m1)"/>
  <path class="arr2" d="M250 72 A 78 78 0 0 1 250 228"/>
  <path class="arr2" d="M250 72 A 78 78 0 0 0 250 228"/>

  <circle cx="250" cy="72" r="24" fill="#4B3FE3" stroke="#4B3FE3"/>
  <text class="rk2" x="250" y="77">r0</text>
  <circle cx="328" cy="150" r="24" fill="#FFFFFF" stroke="rgba(23,23,23,0.30)"/>
  <text class="rk" x="328" y="155">r1</text>
  <circle cx="250" cy="228" r="24" fill="#FFFFFF" stroke="rgba(23,23,23,0.30)"/>
  <text class="rk" x="250" y="233">r2</text>
  <circle cx="172" cy="150" r="24" fill="#FFFFFF" stroke="rgba(23,23,23,0.30)"/>
  <text class="rk" x="172" y="155">r3</text>

  <text class="ns" x="250" y="44" text-anchor="middle" style="fill:#1A1759;">myRank = 0</text>
  <text class="ns" x="336" y="118" style="fill:#1D4ED8;">i=1 顺时针 → rank1</text>
  <text class="ns" x="60" y="118" style="fill:#1D4ED8;">i=1 逆时针 → rank3</text>
  <text class="ns" x="250" y="272" text-anchor="middle" style="fill:#B45309;">i=2：顺逆两条路都到 rank2，去重后只算一个</text>

  <!-- 右侧说明 -->
  <rect x="380" y="78" width="310" height="152" rx="9" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="nt" x="396" y="100">本轮怎么算出来的</text>
  <text class="mono" x="396" y="122">rightRemoteRank = (myRank + i) % N</text>
  <text class="mono" x="396" y="140">leftRemoteRank  = (myRank + N − i) % N</text>
  <text class="ns" x="396" y="162">pairNumPerRound = (3+1)/2 = 2 → i 取 1、2</text>
  <text class="ns" x="396" y="180">i=1 → rank3、rank1</text>
  <text class="ns" x="396" y="198">i=2 → rank2（左右重合）</text>
  <text class="ns" x="396" y="220" style="fill:#1A1759;">commRanks = [3, 1, 2]，commLoops = ceil(3/3) = 1</text>

  <!-- ============ 泳道 ============ -->
  <line x1="30" y1="290" x2="690" y2="290" stroke="rgba(23,23,23,0.14)" stroke-width="1"/>
  <text class="nt" x="30" y="312">这一轮实际落到线程上的任务</text>

  <line x1="176" y1="322" x2="176" y2="390" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="ns" x="176" y="316" text-anchor="middle" style="fill:#047857;">PreSync</text>
  <line x1="608" y1="322" x2="608" y2="390" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="ns" x="608" y="316" text-anchor="middle" style="fill:#047857;">PostSync</text>

  <!-- thread0 -->
  <rect x="30" y="322" width="660" height="24" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ns" x="38" y="338" style="font-size:9.5px;">thread0</text>
  <rect x="186" y="326" width="120" height="16" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text class="blk" x="246" y="338" text-anchor="middle" style="fill:#6D28D9;font-size:9px;">本地拷贝（发给自己）</text>
  <rect x="314" y="326" width="150" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text class="blk" x="389" y="338" text-anchor="middle" style="fill:#1D4ED8;font-size:9px;">↔ rank3 收 + 发</text>

  <!-- thread1 -->
  <rect x="30" y="350" width="660" height="24" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ns" x="38" y="366" style="font-size:9.5px;">thread1</text>
  <rect x="314" y="354" width="150" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text class="blk" x="389" y="366" text-anchor="middle" style="fill:#1D4ED8;font-size:9px;">↔ rank1 收 + 发</text>

  <!-- thread2 -->
  <rect x="30" y="378" width="660" height="24" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ns" x="38" y="394" style="font-size:9.5px;">thread2</text>
  <rect x="314" y="382" width="150" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text class="blk" x="389" y="394" text-anchor="middle" style="fill:#1D4ED8;font-size:9px;">↔ rank2 收 + 发</text>

  <text class="ts" x="30" y="416">发给自己的那一块不走网络，直接本地拷（LocalCopyForMyRank）—— 全 mesh 里唯一一条「不发出去」的数据流。</text>
</svg>
