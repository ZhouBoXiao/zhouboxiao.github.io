<svg viewBox="0 0 600 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="通信域切分与双重编号">
  <title>MPI_Comm_split：切分通信域后每个进程有两套编号</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="24" width="520" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="56" y="44" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0C447C">MPI_COMM_WORLD（大群聊）</text>
  <rect x="56" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="82" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 0</text>
  <rect x="114" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="140" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 1</text>
  <rect x="172" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="198" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 2</text>
  <rect x="230" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="256" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 3</text>
  <rect x="288" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="314" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 4</text>
  <rect x="346" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="372" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 5</text>
  <rect x="404" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="430" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 6</text>
  <rect x="462" y="52" width="52" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="488" y="61" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#0C447C">rank 7</text>
  <path d="M180 76 L140 110" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M420 76 L460 110" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="170" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">color = 0</text>
  <text x="430" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">color = 1</text>
  <rect x="40" y="116" width="240" height="86" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#085041">row_comm 队伍 A</text>
  <rect x="56" y="148" width="48" height="20" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="80" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#04342C">row 0</text>
  <rect x="112" y="148" width="48" height="20" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="136" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#04342C">row 1</text>
  <rect x="168" y="148" width="48" height="20" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="192" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#04342C">row 2</text>
  <rect x="224" y="148" width="48" height="20" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="248" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#04342C">row 3</text>
  <text x="160" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">成员：world rank 0-3</text>
  <rect x="320" y="116" width="240" height="86" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="440" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#633806">row_comm 队伍 B</text>
  <rect x="336" y="148" width="48" height="20" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text x="360" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#412402">row 0</text>
  <rect x="392" y="148" width="48" height="20" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text x="416" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#412402">row 1</text>
  <rect x="448" y="148" width="48" height="20" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text x="472" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#412402">row 2</text>
  <rect x="504" y="148" width="48" height="20" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text x="528" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#412402">row 3</text>
  <text x="440" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">成员：world rank 4-7</text>
  <rect x="40" y="222" width="520" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="300" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">每个进程有两套身份证：全局 rank（world）+ 局部 rank（队内）</text>
  <text x="300" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">此后 Bcast / Reduce 只在小队内部进行；跨队通信要用全局 rank</text>
  <text x="300" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">按名单组队时，名单外的进程得到 MPI_COMM_NULL，使用前必须检查</text>
</svg>
