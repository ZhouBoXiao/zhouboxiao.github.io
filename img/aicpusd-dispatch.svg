<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-label="设备侧的三张分派表">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  </style>
  <rect x="0" y="0" width="720" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#52525B"/>
    </marker>
  </defs>

  <text class="tb" x="30" y="30">设备侧有三张表，不是一张</text>
  <text class="ts" x="30" y="50">三张都是「按 key 找函数指针」，和 host 侧 TaskFuncSingle 是同一招；区别只在 key 的类型</text>

  <!-- 第一层：两个来源 -->
  <rect x="40" y="70" width="300" height="60" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="bd" x="58" y="94">① 消息通道</text>
  <text class="ts" x="58" y="116">key = cmd_type，11 个整数</text>

  <rect x="380" y="70" width="300" height="60" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="bd" x="398" y="94">② 驱动事件通道</text>
  <text class="ts" x="398" y="116">key = subevent_id，枚举下标</text>

  <path d="M190 132 L190 156" stroke="#52525B" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M530 132 L530 156" stroke="#52525B" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 第二层：两个入口 -->
  <rect x="40" y="160" width="300" height="64" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="58" y="184">AicpuSqeAdapter</text>
  <text class="ts" x="58" y="206">InitAdapterFuncMap：v0 / v1 双表</text>

  <rect x="380" y="160" width="300" height="64" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="398" y="184">ProcessAICPUEvent</text>
  <text class="ts" x="398" y="206">eventTaskProcess_[11] —— 实挂 9 个</text>

  <path d="M190 226 L190 254" stroke="#52525B" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M530 226 L530 254" stroke="#52525B" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 第三层：汇合到 HwtsTsKernel -->
  <rect x="40" y="258" width="640" height="56" rx="6" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="58" y="282">HwtsTsKernel</text>
  <text class="ts" x="58" y="302">不管是哪条路进来的算子，最终都会变成这个结构：kernelType + kernelSo + paramBase</text>

  <path d="M190 316 L190 344" stroke="#52525B" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M530 316 L530 344" stroke="#52525B" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 第四层：两条去向 -->
  <rect x="40" y="348" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="1.3"/>
  <text class="mono" x="58" y="372" style="fill:#1A1759;">kernelSo == 0</text>
  <text class="ts" x="58" y="394">→ HwTsKernelRegister，21 个逻辑核</text>

  <rect x="380" y="348" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="1.3"/>
  <text class="mono" x="398" y="372" style="fill:#1A1759;">kernelSo != 0</text>
  <text class="ts" x="398" y="394">→ aeCallInterface，进 .so 里调函数</text>

  <!-- 底部 -->
  <rect x="30" y="436" width="660" height="48" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.10)"/>
  <text class="ts" x="46" y="456">第三张表最有意思：<tspan style="fill:#3F3A8C;">21 个逻辑核里没有一个算子，全是「控制面」动作——建队列、配超时、开日志、装 .so。</tspan></text>
  <text class="ts" x="46" y="474">这也印证了前面那个疑问：算子不在这张表里，它走的是 kernelSo 那条分支。</text>
</svg>
