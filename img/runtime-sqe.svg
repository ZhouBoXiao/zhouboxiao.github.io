<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516" role="img" aria-label="SQE 的 64 字节结构与通用头位域">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.5; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="516" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">SQE：几十个字段的 TaskInfo，压成 64 个字节</text>
  <text class="ts" x="30" y="50">定长是刻意的——硬件按 pos × 64 直接寻址，所以 taskId 就等于槽位号</text>

  <!-- 转换 -->
  <rect x="40" y="64" width="252" height="50" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="bd" x="54" y="84">TaskInfo</text>
  <text class="ts" x="54" y="102">C++ 结构，含 union 与几十个字段</text>

  <path class="arr" d="M300 89 L354 89" marker-end="url(#a3)"/>

  <rect x="362" y="64" width="318" height="50" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.3"/>
  <text class="bd" x="376" y="84">SQE（rtDavidSqe_t）</text>
  <text class="ts" x="376" y="102">static_assert(sizeof(...) == 64) 卡死在编译期</text>

  <text class="ts" x="40" y="132">左框被 ToConstructSqe 折叠成右框：64 字节 = 16 个 32 位 word，硬件按整条取</text>

  <!-- 16 word bar -->
  <g>
    <rect x="40" y="140" width="40" height="44" fill="#EDEBFF" stroke="rgba(75,63,227,0.45)"/>
    <rect x="80" y="140" width="40" height="44" fill="#EDEBFF" stroke="rgba(75,63,227,0.45)"/>
    <rect x="120" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="160" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="200" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="240" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="280" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="320" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="360" y="140" width="40" height="44" fill="#F2F7FF" stroke="rgba(75,63,227,0.45)"/>
    <rect x="400" y="140" width="40" height="44" fill="#F2F7FF" stroke="rgba(75,63,227,0.45)"/>
    <rect x="440" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="480" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="520" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="560" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="600" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <rect x="640" y="140" width="40" height="44" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  </g>
  <text class="mono" x="60" y="167" text-anchor="middle">W0</text>
  <text class="mono" x="100" y="167" text-anchor="middle">W1</text>
  <text class="mono" x="140" y="167" text-anchor="middle">W2</text>
  <text class="mono" x="180" y="167" text-anchor="middle">W3</text>
  <text class="mono" x="220" y="167" text-anchor="middle">W4</text>
  <text class="mono" x="260" y="167" text-anchor="middle">W5</text>
  <text class="mono" x="300" y="167" text-anchor="middle">W6</text>
  <text class="mono" x="340" y="167" text-anchor="middle">W7</text>
  <text class="mono" x="380" y="167" text-anchor="middle">W8</text>
  <text class="mono" x="420" y="167" text-anchor="middle">W9</text>
  <text class="mono" x="460" y="167" text-anchor="middle">W10</text>
  <text class="mono" x="500" y="167" text-anchor="middle">W11</text>
  <text class="mono" x="540" y="167" text-anchor="middle">W12</text>
  <text class="mono" x="580" y="167" text-anchor="middle">W13</text>
  <text class="mono" x="620" y="167" text-anchor="middle">W14</text>
  <text class="mono" x="660" y="167" text-anchor="middle">W15</text>
  <text class="ts" x="40" y="200">紫底 = 通用头（所有 SQE 类型共用），蓝底 = 内核执行的起始 PC</text>

  <!-- 表格 -->
  <text class="th" x="40" y="226">每条 SQE 装什么</text>
  <path d="M40 234 L680 234" stroke="rgba(23,23,23,0.14)" stroke-width="1" fill="none"/>
  <text class="ts" x="52" y="252" style="fill:#171717;">W0–W1</text>
  <text class="ts" x="128" y="252">通用头：type、锁标志、中断使能、预取、wrCqe、blockDim、streamId、taskId</text>
  <text class="ts" x="52" y="274" style="fill:#171717;">W2–W5</text>
  <text class="ts" x="128" y="274">调度侧：scheme、kernelCredit、icache 预取、qos、读写 wrr 权重</text>
  <text class="ts" x="52" y="296" style="fill:#171717;">W6–W7</text>
  <text class="ts" x="128" y="296">stackPhyBase：AI Core 栈的物理基址（48 位，分高低两段）</text>
  <text class="ts" x="52" y="318" style="fill:#171717;">W8–W9</text>
  <text class="ts" x="128" y="318">aicStartPc / aivStartPc：设备侧函数地址，48 位拆成 low + high</text>
  <text class="ts" x="52" y="340" style="fill:#171717;">W10–W15</text>
  <text class="ts" x="128" y="340">按 SQE 类型展开：参数指针、blockDim 分组、同步与报告配置</text>

  <!-- 通用头 chip 行 -->
  <text class="th" x="40" y="372">W0 / W1：通用头长什么样</text>

  <rect x="40" y="382" width="110" height="34" rx="5" fill="#EDEBFF" stroke="rgba(75,63,227,0.45)"/>
  <text class="mono" x="52" y="403">type : 6</text>
  <rect x="160" y="382" width="126" height="34" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="172" y="403">blockDim : 16</text>
  <rect x="296" y="382" width="140" height="34" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="308" y="403">rtStreamId : 16</text>
  <rect x="446" y="382" width="126" height="34" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="458" y="403">taskId : 16</text>
  <text class="ts" x="586" y="403">← 三者拼成 W1</text>

  <rect x="40" y="426" width="76" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="48" y="445" style="font-size:9.5px;">l1Lock</text>
  <rect x="121" y="426" width="76" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="129" y="445" style="font-size:9.5px;">l1UnLock</text>
  <rect x="202" y="426" width="60" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="210" y="445" style="font-size:9.5px;">ie</text>
  <rect x="267" y="426" width="60" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="275" y="445" style="font-size:9.5px;">preP</text>
  <rect x="332" y="426" width="60" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="340" y="445" style="font-size:9.5px;">postP</text>
  <rect x="397" y="426" width="76" height="28" rx="5" fill="#FEF2F2" stroke="#E11D48" stroke-width="1.3"/>
  <text class="mono" x="405" y="445" style="font-size:9.5px; fill:#9F1239;">wrCqe</text>
  <rect x="478" y="426" width="76" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="486" y="445" style="font-size:9.5px;">rdConds</text>
  <rect x="559" y="426" width="76" height="28" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="mono" x="567" y="445" style="font-size:9.5px;">res1 : 3</text>

  <!-- callout -->
  <rect x="40" y="466" width="640" height="42" rx="7" fill="#FEF2F2" stroke="rgba(225,29,72,0.35)"/>
  <text class="ts" x="54" y="484" style="fill:#9F1239;">wrCqe 的实现只有一行：return (dvppGrp_ != nullptr);</text>
  <text class="ts" x="54" y="500" style="fill:#9F1239;">—— 只有 DVPP 流才默认回写 CQE；普通算子完成与否不看 CQE，靠 SQ head 追平。</text>
</svg>
