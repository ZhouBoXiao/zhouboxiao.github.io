<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="一次 AICPU 模式调用在 Host 与 Device 两侧的完整链路">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 11.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.3; stroke-linecap: round; fill: none; }
    .dash { stroke: #C7C7CC; stroke-width: 1; stroke-dasharray: 4 4; }
    .box { fill: #FFFFFF; stroke: rgba(23,23,23,0.12); }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="620" fill="#FFFFFF"/>
  <text class="tb" x="30" y="32">一次 AICPU 模式调用：谁在哪一步做什么</text>
  <text class="ts" x="30" y="52">虚线是 Host-Device 边界——整套设计的全部技巧，都在压缩跨越它的次数</text>

  <rect x="30" y="70" width="310" height="26" rx="6" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text class="th" x="46" y="88">HOST CPU</text>
  <rect x="380" y="70" width="310" height="26" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="th" x="396" y="88" style="fill:#1A1759;">DEVICE · AI CPU（kernel 内部）</text>
  <line class="dash" x1="360" y1="104" x2="360" y2="556"/>

  <rect class="box" x="46" y="110" width="278" height="64" rx="8"/>
  <text class="th" x="58" y="130">① 资源序列化</text>
  <text class="mono" x="58" y="149">resCtx.Serialize() → param.resCtx</text>
  <text class="ts" x="58" y="166">通信域 / Thread / Channel 全部扁平成字节流</text>

  <rect class="box" x="46" y="190" width="278" height="66" rx="8"/>
  <text class="th" x="58" y="210">② 通知 + 保序 + 下发 1 个 kernel</text>
  <text class="mono" x="58" y="229">NotifyRecord → aclrtLaunchKernel</text>
  <text class="ts" x="58" y="247">入参只有 OpParam*，numBlocks = 1</text>

  <path class="arr" d="M330 216 L388 216" marker-end="url(#m1)"/>
  <text class="ts" x="359" y="206" text-anchor="middle">下发 kernel</text>

  <rect x="46" y="300" width="278" height="100" rx="8" fill="#FFFFFF" stroke="#C7C7CC" stroke-dasharray="4 4"/>
  <text class="th" x="58" y="322">host 侧的账</text>
  <text class="ts" x="58" y="346">· 跨界动作：1 次下发 + 1 次等待</text>
  <text class="ts" x="58" y="366">· 不参与任何 task 的展开与提交</text>
  <text class="ts" x="58" y="386">· 通信耗时不再挤占 host CPU 时间</text>

  <rect class="box" x="396" y="190" width="278" height="66" rx="8"/>
  <text class="th" x="408" y="210">③ 反序列化还原上下文</text>
  <text class="mono" x="408" y="229">GetResCtxWithCache → DeSerialize</text>
  <text class="ts" x="408" y="247">变长参数（alltoallv 等）按 rankSize 重算偏移</text>

  <path class="arrg" d="M535 256 L535 268" marker-end="url(#m2)"/>

  <rect class="box" x="396" y="272" width="278" height="66" rx="8"/>
  <text class="th" x="408" y="292">④ BatchModeStart + 编排展开</text>
  <text class="mono" x="408" y="311">首个 task = NotifyWait → Orchestrate()</text>
  <text class="ts" x="408" y="329">先等输入就绪，再按算法产出几百个 task</text>

  <path class="arrg" d="M535 338 L535 346" marker-end="url(#m2)"/>

  <rect class="box" x="396" y="346" width="278" height="118" rx="8"/>
  <text class="th" x="408" y="366">⑤ Task Cache：同一 cacheTag 的分支</text>
  <rect x="408" y="378" width="82" height="58" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.1"/>
  <text class="ts" x="449" y="396" text-anchor="middle" style="fill:#1A1759;">cache hit</text>
  <text class="mono" x="449" y="414" text-anchor="middle" style="font-size:11px;">Execute()</text>
  <text class="ts" x="449" y="430" text-anchor="middle">改地址/钥匙/取件码</text>
  <rect x="500" y="378" width="82" height="58" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.1"/>
  <text class="ts" x="541" y="396" text-anchor="middle" style="fill:#1A1759;">cache miss</text>
  <text class="mono" x="541" y="414" text-anchor="middle" style="font-size:11px;">Start→展开→End</text>
  <text class="ts" x="541" y="430" text-anchor="middle">录制 entry</text>
  <rect x="592" y="378" width="82" height="58" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="ts" x="633" y="396" text-anchor="middle">不使能</text>
  <text class="mono" x="633" y="414" text-anchor="middle" style="font-size:11px;">Orchestrate()</text>
  <text class="ts" x="633" y="430" text-anchor="middle">每次重展开</text>
  <text class="ts" x="408" y="454">只有 miss / 不使能分支才真正编排，hit 分支直接跳到下发</text>

  <path class="arrg" d="M535 464 L535 474" marker-end="url(#m2)"/>

  <rect x="396" y="478" width="278" height="72" rx="8" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="th" x="408" y="498" style="fill:#1A1759;">⑥ BatchModeEnd → 统一提交</text>
  <text class="mono" x="408" y="517">托盘 → 收件箱(SQE/WQE) → 按一次铃</text>
  <text class="ts" x="408" y="535">几百个 task 只在末端更新一次 tail</text>

  <rect class="box" x="46" y="478" width="278" height="72" rx="8"/>
  <text class="th" x="58" y="498">⑦ 等待通知后返回</text>
  <text class="mono" x="58" y="517">NotifyWaitOnThread(cpuTsThread)</text>
  <text class="ts" x="58" y="535">期间通信与 device 侧计算流并行推进</text>

  <path class="arr" d="M392 514 L332 514" marker-end="url(#m1)"/>
  <text class="ts" x="362" y="506" text-anchor="middle">完成通知</text>

  <text class="ts" x="30" y="580">三层优化逐层加深：resCtx 缓存（省反序列化）→ BatchMode（省 doorbell）→ Task Cache（省展开）</text>
  <text class="ts" x="30" y="600" style="fill:#166534;">叠加之后，重复执行的集合通信在 host 侧的开销趋近于一次 kernel 提交</text>
</svg>
