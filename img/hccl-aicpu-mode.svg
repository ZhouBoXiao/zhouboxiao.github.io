<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="CPU_TS 与 AICPU_TS 两种模式的下发路径对比">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 11.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.3; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>
  <text class="tb" x="30" y="30">同一件事的两种做法：谁展开、谁提交</text>
  <text class="ts" x="30" y="50">一次集合通信要拆成几百个 task，差别在于这些 task 在哪展开、要跨几次 Host-Device 边界</text>
  <rect x="30" y="64" width="660" height="176" rx="10" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text class="bd" x="46" y="86">CPU_TS（HOST 模式）</text>
  <rect x="596" y="72" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text class="ts" x="636" y="86" text-anchor="middle" style="fill:#9F1239;">host bound</text>
  <rect x="46" y="96" width="250" height="126" rx="8" fill="#FFFFFF" stroke="rgba(23,23,23,0.12)"/>
  <text class="ts" x="58" y="114">HOST CPU</text>
  <text class="th" x="58" y="134">算法展开成 N 个 task</text>
  <rect x="58" y="146" width="32" height="20" rx="4" fill="#EDEDF0" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="74" y="160" text-anchor="middle">T1</text>
  <rect x="96" y="146" width="32" height="20" rx="4" fill="#EDEDF0" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="112" y="160" text-anchor="middle">T2</text>
  <rect x="134" y="146" width="32" height="20" rx="4" fill="#EDEDF0" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="150" y="160" text-anchor="middle">T3</text>
  <rect x="172" y="146" width="32" height="20" rx="4" fill="#EDEDF0" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="188" y="160" text-anchor="middle">T4</text>
  <rect x="210" y="146" width="32" height="20" rx="4" fill="#EDEDF0" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="226" y="160" text-anchor="middle">T5</text>
  <rect x="248" y="146" width="32" height="20" rx="4" fill="#EDEDF0" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="264" y="160" text-anchor="middle">T6</text>
  <text class="ts" x="58" y="184">… 一个算子几百个 task</text>
  <text class="ts" x="58" y="206">逐个调用 runtime 接口下发</text>
  <path class="arrg" d="M304 132 L344 132" marker-end="url(#m2)"/>
  <path class="arrg" d="M304 150 L344 150" marker-end="url(#m2)"/>
  <path class="arrg" d="M304 168 L344 168" marker-end="url(#m2)"/>
  <text class="ts" x="324" y="200" text-anchor="middle">×N 次</text>
  <text class="ts" x="324" y="216" text-anchor="middle">2~5μs/次</text>
  <rect x="356" y="96" width="318" height="126" rx="8" fill="#FFFFFF" stroke="rgba(23,23,23,0.12)"/>
  <text class="ts" x="368" y="114">DEVICE</text>
  <rect x="368" y="124" width="130" height="40" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="th" x="433" y="142" text-anchor="middle">TS 队列</text>
  <text class="ts" x="433" y="157" text-anchor="middle">收一个执行一个</text>
  <path class="arrg" d="M498 144 L520 144" marker-end="url(#m2)"/>
  <rect x="524" y="124" width="136" height="40" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="th" x="592" y="142" text-anchor="middle">SDMA / RDMA</text>
  <text class="ts" x="592" y="157" text-anchor="middle">不缓存，下发即执行</text>
  <text class="ts" x="368" y="192">TS 从队列顺序取 task，按类型调用引擎搬运</text>
  <text class="ts" x="368" y="212" style="fill:#9F1239;">瓶颈在 host 提交速度，不在链路带宽</text>
  <rect x="30" y="256" width="660" height="176" rx="10" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.4"/>
  <text class="bd" x="46" y="278">AICPU_TS（AI_CPU 模式）</text>
  <rect x="596" y="264" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#4B3FE3"/>
  <text class="ts" x="636" y="278" text-anchor="middle" style="fill:#166534;">1 次交互</text>
  <rect x="46" y="288" width="250" height="126" rx="8" fill="#FFFFFF" stroke="rgba(23,23,23,0.12)"/>
  <text class="ts" x="58" y="306">HOST CPU</text>
  <text class="th" x="58" y="326">只提交 1 个 kernel</text>
  <rect x="58" y="338" width="196" height="30" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="mono" x="156" y="357" text-anchor="middle">AicpuKernel(OpParam*)</text>
  <text class="ts" x="58" y="386">入参仅一个 OpParam 指针</text>
  <text class="ts" x="58" y="404">numBlocks = 1</text>
  <path class="arr" d="M304 336 L344 336" marker-end="url(#m1)"/>
  <text class="ts" x="324" y="326" text-anchor="middle">×1 次</text>
  <rect x="356" y="288" width="318" height="126" rx="8" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="ts" x="368" y="306" style="fill:#1A1759;">DEVICE · AI CPU</text>
  <rect x="368" y="314" width="140" height="34" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.1"/>
  <text class="th" x="438" y="335" text-anchor="middle">kernel 内展开</text>
  <path class="arr" d="M508 331 L528 331" marker-end="url(#m1)"/>
  <rect x="532" y="314" width="128" height="34" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.1"/>
  <text class="th" x="596" y="335" text-anchor="middle">BatchMode 攒批</text>
  <text class="ts" x="368" y="368">BatchModeStart → 编排 → BatchModeEnd 统一提交</text>
  <text class="ts" x="368" y="386">再由 TS 调度到 SDMA / RDMA 执行</text>
  <text class="ts" x="368" y="404" style="fill:#166534;">不占 AI Core，host 只等一次完成通知</text>
  <text class="ts" x="30" y="454">更进一步：同一算子反复执行时可启用 AICPU Task Cache，命中后连展开都跳过，只刷新 SQE/WQE 地址字段</text>
</svg>
