<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-label="灵衢设备虚拟化：直通分层与设备多虚一">
  <style>
    .th { fill: #171717; font: 500 15px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tb { fill: #1A1759; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tc { fill: #3F3A8C; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .td { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tq { fill: #3F3A8C; font: 400 10px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .panel { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
    .chip { fill: #FFFFFF; stroke: #A9AEFF; }
    .strip { fill: #F2F7FF; stroke: #A9AEFF; }
  </style>
  <defs>
    <marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="640" fill="#FFFFFF"/>

  <text class="th" x="40" y="34">设备虚拟化：上半是直通分层，下半是设备多虚一</text>

  <rect class="panel" x="40" y="52" width="640" height="70" rx="10"/>
  <text class="tb" x="58" y="74">GuestOS</text>
  <rect class="chip" x="58" y="84" width="186" height="30" rx="8"/>
  <text class="tc" x="151" y="103" text-anchor="middle">ummu driver（stage1）</text>
  <rect class="chip" x="265" y="84" width="186" height="30" rx="8"/>
  <text class="tc" x="358" y="103" text-anchor="middle">UBus driver（拓扑扫描）</text>
  <rect class="chip" x="472" y="84" width="190" height="30" rx="8"/>
  <text class="tc" x="567" y="103" text-anchor="middle">UB Entity driver</text>

  <path class="arr" stroke="#4B3FE3" d="M360 122 V134" marker-end="url(#v)"/>

  <rect class="panel" x="40" y="134" width="640" height="78" rx="10"/>
  <text class="tb" x="58" y="156">QEMU / libvirt（用户态）</text>
  <rect class="chip" x="58" y="164" width="143" height="40" rx="8"/>
  <text class="tc" x="129" y="182" text-anchor="middle">vUMMU</text>
  <text class="td" x="129" y="198" text-anchor="middle">stage1 页表</text>
  <rect class="chip" x="211" y="164" width="143" height="40" rx="8"/>
  <text class="tc" x="282" y="182" text-anchor="middle">vBusController</text>
  <text class="td" x="282" y="198" text-anchor="middle">虚拟总线入口</text>
  <rect class="chip" x="364" y="164" width="143" height="40" rx="8"/>
  <text class="tc" x="435" y="182" text-anchor="middle">vUBDev</text>
  <text class="td" x="435" y="198" text-anchor="middle">配置 + 资源空间</text>
  <rect class="chip" x="517" y="164" width="145" height="40" rx="8"/>
  <text class="tc" x="589" y="182" text-anchor="middle">vfio-ub</text>
  <text class="td" x="589" y="198" text-anchor="middle">暴露给用户态</text>

  <path class="arr" stroke="#4B3FE3" d="M360 212 V224" marker-end="url(#v)"/>

  <rect class="panel" x="40" y="224" width="640" height="78" rx="10"/>
  <text class="tb" x="58" y="246">HostOS Kernel</text>
  <rect class="chip" x="58" y="254" width="143" height="40" rx="8"/>
  <text class="tc" x="129" y="272" text-anchor="middle">UBus driver</text>
  <text class="td" x="129" y="288" text-anchor="middle">设备树 · 热插拔</text>
  <rect class="chip" x="211" y="254" width="143" height="40" rx="8"/>
  <text class="tc" x="282" y="272" text-anchor="middle">ummu driver</text>
  <text class="td" x="282" y="288" text-anchor="middle">UMMU 页表</text>
  <rect class="chip" x="364" y="254" width="143" height="40" rx="8"/>
  <text class="tc" x="435" y="272" text-anchor="middle">KVM</text>
  <text class="td" x="435" y="288" text-anchor="middle">USI 中断重映射</text>
  <rect class="chip" x="517" y="254" width="145" height="40" rx="8"/>
  <text class="tc" x="589" y="272" text-anchor="middle">iommufd</text>
  <text class="td" x="589" y="288" text-anchor="middle">IO 页表 API</text>

  <path class="arr" stroke="#4B3FE3" d="M360 302 V314" marker-end="url(#v)"/>

  <rect class="panel" x="40" y="314" width="640" height="48" rx="10"/>
  <text class="tc" x="58" y="344">硬件：UB Decoder · Bus Controller · UB Entity · UMMU · 设备池（DPU / NIC / SSU）</text>

  <rect class="strip" x="40" y="374" width="640" height="42" rx="10"/>
  <text class="tc" x="58" y="400">UB Firmware（edk2）：向 GuestOS 上报 BusController / UMMU / 可分配 UB 资源与中断映射</text>

  <rect class="panel" x="40" y="452" width="640" height="176" rx="10"/>
  <text class="tb" x="58" y="476">设备多虚一（FusionD）：队列级聚合映射，IO 跨卡调度</text>

  <rect x="58" y="490" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="td" x="68" y="510">物理子设备 1（dslice dev）</text>
  <rect x="68" y="516" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="83" y="530" text-anchor="middle">q0</text>
  <rect x="104" y="516" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="119" y="530" text-anchor="middle">q1</text>
  <rect x="140" y="516" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="155" y="530" text-anchor="middle">q2</text>
  <rect x="176" y="516" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="191" y="530" text-anchor="middle">q3</text>
  <rect x="212" y="516" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="227" y="530" text-anchor="middle">q4</text>

  <rect x="58" y="552" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="td" x="68" y="572">物理子设备 2（dslice dev）</text>
  <rect x="68" y="578" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="83" y="592" text-anchor="middle">q0</text>
  <rect x="104" y="578" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="119" y="592" text-anchor="middle">q1</text>
  <rect x="140" y="578" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="155" y="592" text-anchor="middle">q2</text>
  <rect x="176" y="578" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="191" y="592" text-anchor="middle">q3</text>
  <rect x="212" y="578" width="30" height="18" rx="4" fill="#F2F7FF" stroke="#A9AEFF"/>
  <text class="tq" x="227" y="592" text-anchor="middle">q4</text>

  <rect class="strip" x="290" y="490" width="180" height="114" rx="8"/>
  <text class="td" x="300" y="510">聚合设备（Fusion dev）</text>
  <rect x="300" y="522" width="28" height="20" rx="4" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="tq" x="314" y="537" text-anchor="middle">0</text>
  <rect x="332" y="522" width="28" height="20" rx="4" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="tq" x="346" y="537" text-anchor="middle">1</text>
  <rect x="364" y="522" width="28" height="20" rx="4" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="tq" x="378" y="537" text-anchor="middle">2</text>
  <rect x="396" y="522" width="28" height="20" rx="4" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="tq" x="410" y="537" text-anchor="middle">3</text>
  <rect x="428" y="522" width="28" height="20" rx="4" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="tq" x="442" y="537" text-anchor="middle">4</text>
  <text class="td" x="300" y="562">q0-&gt;d1  q2-&gt;d1  q4-&gt;d1</text>
  <text class="td" x="300" y="582">q1-&gt;d2  q3-&gt;d2</text>

  <rect x="490" y="510" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#A9AEFF"/>
  <text class="tb" x="500" y="532">Guest VM</text>
  <text class="tc" x="500" y="552">单一 virtio 设备</text>
  <text class="td" x="500" y="572">AA / AP 双模式</text>

  <path class="arr" stroke="#4B3FE3" d="M268 525 H286" marker-end="url(#v)"/>
  <path class="arr" stroke="#4B3FE3" d="M268 587 H286" marker-end="url(#v)"/>
  <path class="arr" stroke="#4B3FE3" d="M470 547 H486" marker-end="url(#v)"/>

  <text class="td" x="58" y="620">软件栈：QEMU → vfio-fusiond → FusionD → hiaggre_virtio → hiaggre_dslice</text>
</svg>
