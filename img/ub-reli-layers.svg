<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="UB 四层可靠性：物理层、数据链路层、网络层、传输层、事务层各自负责什么">
  <style>
    .th { fill: #171717; font: 500 15px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tw { fill: #FFFFFF; font: 500 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tb { fill: #1A1759; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tc { fill: #3F3A8C; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .td { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .panel { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
    .chip { fill: #FFFFFF; stroke: #A9AEFF; }
    .strip { fill: #F2F7FF; stroke: #A9AEFF; }
  </style>
  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>

  <text class="th" x="40" y="30">可靠性是叠出来的：五层各管一段，谁也不替谁兜底</text>

  <rect class="panel" x="40" y="50" width="640" height="262" rx="10"/>

  <text class="td" x="56" y="74">层</text>
  <text class="td" x="168" y="74">怎么发现坏了</text>
  <text class="td" x="320" y="74">怎么补回来</text>
  <text class="td" x="528" y="74">代价 / 范围</text>
  <line x1="56" y1="82" x2="664" y2="82" stroke="rgba(23,23,23,0.12)"/>

  <text class="tb" x="56" y="106">物理层</text>
  <text class="td" x="168" y="106">FEC 解码状态</text>
  <text class="td" x="320" y="106">不自己补，报给链路层</text>
  <text class="td" x="528" y="106">Lane 级，纳秒</text>
  <line x1="56" y1="118" x2="664" y2="118" stroke="rgba(23,23,23,0.08)"/>

  <text class="tb" x="56" y="152">数据链路层</text>
  <text class="td" x="168" y="152">BCRC（CRC-30）</text>
  <text class="td" x="320" y="152">GoBackN 重传 + Retry Buffer</text>
  <text class="td" x="528" y="152">一跳往返，μs</text>
  <line x1="56" y1="164" x2="664" y2="164" stroke="rgba(23,23,23,0.08)"/>

  <text class="tb" x="56" y="198">网络层</text>
  <text class="td" x="168" y="198">ICRC-32 端到端</text>
  <text class="td" x="320" y="198">只丢弃，不回 ACK</text>
  <text class="td" x="528" y="198">端到端，ms</text>
  <line x1="56" y1="210" x2="664" y2="210" stroke="rgba(23,23,23,0.08)"/>

  <text class="tb" x="56" y="244">传输层</text>
  <text class="td" x="168" y="244">PSN / EPSN / BitMap</text>
  <text class="td" x="320" y="244">TPACK/TPNAK/TPSACK</text>
  <text class="td" x="528" y="244">端到端，RTT 级</text>
  <line x1="56" y1="256" x2="664" y2="256" stroke="rgba(23,23,23,0.08)"/>

  <text class="tb" x="56" y="290">事务层</text>
  <text class="td" x="168" y="290">TAACK</text>
  <text class="td" x="320" y="290">ROI/ROT/ROL 决定谁等</text>
  <text class="td" x="528" y="290">编程模型</text>

  <rect class="strip" x="40" y="326" width="640" height="130" rx="10"/>
  <text class="tc" x="56" y="352">分工线画在这里：链路层负责把「误码」吃干净，传输层只管「路由丢包」和「拥塞丢包」。</text>
  <text class="tc" x="56" y="376">所以链路质量够高、或两端直连时，可以直接用 CTP —— 把传输层整套重传砍掉。</text>
  <text class="tc" x="56" y="400">反过来，一旦开了逐包负载均衡，链路层治不了「乱序」，必须回头调传输层策略。</text>
  <text class="td" x="56" y="426">依据：规范 4.7（链路层重传）、5.3.7（ICRC）、6.3.2（CTP）、6.4（RTP 重传）。</text>
  <text class="td" x="56" y="446">注：四层之外，10.6 还定义了故障上报与 UBFM 复位，那是可靠性之外的另一条线。</text>
</svg>
