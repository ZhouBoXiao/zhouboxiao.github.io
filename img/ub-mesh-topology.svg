<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="UB-Mesh 的 nD-FullMesh 递归拓扑、物理映射与分层带宽">
  <style>
    .th { fill: #171717; font: 500 15px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tw { fill: #FFFFFF; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tb { fill: #1A1759; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tc { fill: #3F3A8C; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .td { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .panel { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
    .chip { fill: #FFFFFF; stroke: #A9AEFF; }
    .strip { fill: #F2F7FF; stroke: #A9AEFF; }
  </style>
  <defs>
    <marker id="s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="470" fill="#FFFFFF"/>

  <text class="th" x="40" y="30">nD-FullMesh：把「全互连」做成递归的，逐层对齐流量局部性</text>

  <rect class="panel" x="40" y="48" width="300" height="200" rx="10"/>
  <text class="tb" x="56" y="70">递归构造：每一维都是一次全互连</text>

  <rect class="chip" x="56" y="84" width="44" height="20" rx="6"/>
  <text class="tc" x="78" y="98" text-anchor="middle">1D</text>
  <text class="tc" x="112" y="98">板内 8 NPU，X 维全互连</text>

  <rect class="chip" x="56" y="112" width="44" height="20" rx="6"/>
  <text class="tc" x="78" y="126" text-anchor="middle">2D</text>
  <text class="tc" x="112" y="126">机柜内 64 NPU，X/Y 两维</text>

  <rect class="chip" x="56" y="140" width="44" height="20" rx="6"/>
  <text class="tc" x="78" y="154" text-anchor="middle">3D</text>
  <text class="tc" x="112" y="154">排内多机柜，再叠一维</text>

  <rect class="chip" x="56" y="168" width="44" height="20" rx="6"/>
  <text class="tc" x="78" y="182" text-anchor="middle">4D</text>
  <text class="tc" x="112" y="182">Pod 内 16 机柜 = 1024 NPU</text>

  <rect class="chip" x="56" y="196" width="44" height="20" rx="6"/>
  <text class="tc" x="78" y="210" text-anchor="middle">nD</text>
  <text class="tc" x="112" y="210">继续向上：本代刻意停在 4D</text>

  <rect class="panel" x="356" y="48" width="324" height="200" rx="10"/>
  <text class="tb" x="372" y="70">物理映射与链路类型占比（估算）</text>
  <text class="td" x="372" y="94">维度</text>
  <text class="td" x="420" y="94">距离</text>
  <text class="td" x="474" y="94">链路类型</text>
  <text class="td" x="664" y="94" text-anchor="end">占比</text>

  <text class="tc" x="372" y="118">X、Y</text>
  <text class="td" x="420" y="118">~1 m</text>
  <text class="tc" x="474" y="118">无源电气电缆</text>
  <text class="tc" x="664" y="118" text-anchor="end">86.7%</text>

  <text class="tc" x="372" y="142">Z</text>
  <text class="td" x="420" y="142">~10 m</text>
  <text class="tc" x="474" y="142">有源电气电缆</text>
  <text class="tc" x="664" y="142" text-anchor="end">7.2%</text>

  <text class="tc" x="372" y="166">α</text>
  <text class="td" x="420" y="166">~10² m</text>
  <text class="tc" x="474" y="166">光缆</text>
  <text class="tc" x="664" y="166" text-anchor="end">4.8%</text>

  <text class="tc" x="372" y="190">β、γ…</text>
  <text class="td" x="420" y="190">~10³ m</text>
  <text class="tc" x="474" y="190">光缆</text>
  <text class="tc" x="664" y="190" text-anchor="end">1.2%</text>

  <text class="td" x="372" y="218">→ 八成以上的线缆是 1 米内的无源电缆，</text>
  <text class="td" x="372" y="236">这才是敢在机柜里做全直连的底气。</text>

  <rect class="panel" x="40" y="262" width="640" height="104" rx="10"/>
  <text class="tb" x="56" y="284">带宽也是分层的：越靠近算力，per-NPU 带宽越高</text>
  <rect x="56" y="294" width="600" height="20" rx="6" fill="#4B3FE3"/>
  <text class="tw" x="68" y="308">机柜内 64 NPU（2D-FM 直连）：UB x56 / NPU</text>
  <rect x="56" y="320" width="400" height="20" rx="6" fill="#6F6FFF"/>
  <text class="tw" x="68" y="334">Pod 内 256~1K NPU：UB x12 / NPU</text>
  <rect x="56" y="346" width="220" height="20" rx="6" fill="#A9AEFF"/>
  <text class="tb" x="68" y="360">2K~8K：UB x4 / NPU</text>
  <text class="td" x="470" y="334">逐层收敛（oversubscribed）</text>

  <rect class="strip" x="40" y="386" width="640" height="68" rx="10"/>
  <text class="tc" x="56" y="410">TP + SP 约占训练流量 97%，且集中在 8~64 个相邻 NPU 内；DP 只占 1.34%，却要跨很远。</text>
  <text class="tc" x="56" y="434">把「近的高带宽、远的收敛」对上流量，就能省掉 98% 高 radix 交换机与 93% 光模块。</text>
</svg>
