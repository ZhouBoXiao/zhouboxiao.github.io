  <rect x="150" y="484" width="12" height="12" rx="3" fill="#A9AEFF"/>
  <text class="ts" x="168" y="494">序列 B</text>
  <rect x="240" y="484" width="12" height="12" rx="3" fill="#6F6FFF"/>
