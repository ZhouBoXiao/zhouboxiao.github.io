  <path class="arr" d="M286 404 L420 404" marker-end="url(#a)"/>

  <rect class="blkA" x="432" y="344" width="34" height="26" rx="5"/>
  <rect class="blkB" x="472" y="344" width="34" height="26" rx="5"/>
  <rect class="blkA" x="512" y="344" width="34" height="26" rx="5"/>
