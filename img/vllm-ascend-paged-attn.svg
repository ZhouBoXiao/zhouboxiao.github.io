<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="传统 KV 缓存与 PagedAttention 分页机制对比">
  <style>
    .t { fill: #171717; font: 400 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .tw { fill: #FFFFFF; font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .panel { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
    .used { fill: #3C2ECA; }
    .resv { fill: none; stroke: #52525B; stroke-dasharray: 5 4; }
    .blkA { fill: #3C2ECA; }
    .blkB { fill: #A9AEFF; }
    .blkC { fill: #6F6FFF; }
    .free { fill: none; stroke: rgba(23,23,23,0.12); }
    .pill { fill: #FFFFFF; stroke: rgba(23,23,23,0.12); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="560" fill="#FFFFFF"/>

  <rect class="panel" x="40" y="32" width="640" height="212" rx="12"/>
  <text class="th" x="60" y="58">传统 KV 缓存 · 每条序列预留最大长度</text>
  <text class="t" x="142" y="101" text-anchor="end">序列 A</text>
  <rect class="used" x="150" y="84" width="150" height="26" rx="5"/>
  <rect class="resv" x="300" y="84" width="240" height="26" rx="5"/>
  <text class="ts" x="420" y="101" text-anchor="middle">预留未用 · 浪费</text>
  <text class="t" x="142" y="143" text-anchor="end">序列 B</text>
  <rect class="used" x="150" y="126" width="260" height="26" rx="5"/>
  <rect class="resv" x="410" y="126" width="130" height="26" rx="5"/>
  <text class="t" x="142" y="185" text-anchor="end">序列 C</text>
  <rect class="used" x="150" y="168" width="100" height="26" rx="5"/>
  <rect class="resv" x="250" y="168" width="290" height="26" rx="5"/>
  <text class="ts" x="60" y="226">内部碎片严重 · 并发数受限 · 相同前缀无法共享</text>

  <rect class="panel" x="40" y="276" width="640" height="252" rx="12"/>
  <text class="th" x="60" y="302">PagedAttention · 分页 KV 缓存</text>
  <text class="ts" x="60" y="328">逻辑视图 · 连续</text>
  <text class="ts" x="432" y="328">物理块池 · 非连续</text>

  <text class="t" x="84" y="362" text-anchor="end">A</text>
