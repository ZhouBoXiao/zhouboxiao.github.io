<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="390" fill="#ffffff"/>

  <!-- ===== 左：负载不均衡 ===== -->
  <rect x="20" y="16" width="420" height="354" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="230" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">无均衡损失：强者恒强</text>

  <!-- 容量线 -->
  <line x1="45" y1="112" x2="425" y2="112" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="422" y="104" text-anchor="end" font-size="12.5" fill="#dc2626">专家容量 C</text>

  <!-- 坐标轴 -->
  <line x1="45" y1="304" x2="425" y2="304" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 柱子 -->
  <rect x="60" y="100" width="60" height="204" fill="#f87171"/>
  <rect x="150" y="170" width="60" height="134" fill="#fca5a5"/>
  <rect x="240" y="254" width="60" height="50" fill="#cbd5e1"/>
  <rect x="330" y="269" width="60" height="35" fill="#cbd5e1"/>

  <!-- 溢出部分 -->
  <rect x="60" y="100" width="60" height="12" fill="#7f1d1d" opacity="0.65"/>
  <text x="128" y="140" font-size="12" fill="#7f1d1d">溢出丢弃!</text>

  <!-- 标注 -->
  <text x="90" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家1</text>
  <text x="180" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家2</text>
  <text x="270" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家3</text>
  <text x="360" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家4</text>

  <text x="90" y="92" text-anchor="middle" font-size="12.5" fill="#7f1d1d">过载</text>
  <text x="270" y="246" text-anchor="middle" font-size="12" fill="#94a3b8">欠训练</text>
  <text x="360" y="261" text-anchor="middle" font-size="12" fill="#94a3b8">欠训练</text>

  <text x="230" y="352" text-anchor="middle" font-size="12.5" fill="#b91c1c">token 涌向少数专家，其余专家得不到训练</text>

  <!-- ===== 右：负载均衡 ===== -->
  <rect x="460" y="16" width="420" height="354" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="670" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">加入辅助损失：雨露均沾</text>

  <line x1="485" y1="112" x2="865" y2="112" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="862" y="104" text-anchor="end" font-size="12.5" fill="#16a34a">专家容量 C</text>

  <line x1="485" y1="304" x2="865" y2="304" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="500" y="154" width="60" height="150" fill="#4ade80"/>
  <rect x="590" y="144" width="60" height="160" fill="#4ade80"/>
  <rect x="680" y="164" width="60" height="140" fill="#4ade80"/>
  <rect x="770" y="149" width="60" height="155" fill="#4ade80"/>

  <text x="530" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家1</text>
  <text x="620" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家2</text>
  <text x="710" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家3</text>
  <text x="800" y="322" text-anchor="middle" font-size="12.5" fill="#475569">专家4</text>

  <text x="530" y="146" text-anchor="middle" font-size="12" fill="#166534">≈25%</text>
  <text x="620" y="136" text-anchor="middle" font-size="12" fill="#166534">≈25%</text>
  <text x="710" y="156" text-anchor="middle" font-size="12" fill="#166534">≈25%</text>
  <text x="800" y="141" text-anchor="middle" font-size="12" fill="#166534">≈25%</text>

  <text x="670" y="352" text-anchor="middle" font-size="12.5" fill="#15803d">各专家负载接近，且都不超过容量上限</text>
</svg>
