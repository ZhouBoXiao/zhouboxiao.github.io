<svg viewBox="0 0 600 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MPI 扁平通信与 HCCL 分层通信对比">
  <title>MPI 扁平通信 vs HCCL 分层通信</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0C447C">MPI 视角：N 个 rank 平铺成一个世界</text>
  <rect x="30" y="38" width="60" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="60" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">rank0</text>
  <rect x="110" y="38" width="60" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="140" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">rank1</text>
  <rect x="190" y="38" width="60" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="220" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">rank2</text>
  <rect x="270" y="38" width="60" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="300" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">rank3</text>
  <rect x="350" y="38" width="60" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="380" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">rank4</text>
  <rect x="430" y="38" width="60" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="460" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">rank5</text>
  <path d="M60 64 L60 82 L220 82 L220 64" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M140 64 L140 88 L300 88 L300 64" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M380 64 L380 94 L460 94 L460 64" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">不区分"这几张卡是否在同一台机器"，统一用树或环算法</text>

  <text x="20" y="148" font-family="sans-serif" font-size="13" font-weight="bold" fill="#633806">HCCL 视角：先分层，每层挑不同算法</text>
  <rect x="30" y="162" width="170" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="115" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#633806">① Server 内归约</text>
  <text x="115" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">Mesh / Star / Double-Ring</text>
  <text x="115" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">HCCS 高速互联，O(1) 步</text>
  <rect x="215" y="162" width="170" height="76" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
  <text x="300" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#412402">② Server 间通信</text>
  <text x="300" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#633806">Ring / RHD / NHR / NB</text>
  <text x="300" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#633806">RoCE 网络，自适应选择</text>
  <rect x="400" y="162" width="170" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="485" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#633806">③ Server 内广播</text>
  <text x="485" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">Mesh / Star</text>
  <text x="485" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">结果回到每张卡</text>
  <path d="M200 200 L215 200" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M385 200 L400 200" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Pipeline 算法：三步流水线化，Server 内外链路并发，大数据量最优</text>
  <text x="300" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">语义与 MPI 一一对应，差别在"怎么走"</text>
</svg>
