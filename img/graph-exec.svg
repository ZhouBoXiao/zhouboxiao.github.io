<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="CaptureModel 执行的四段流程与 BuildSqCq 五阶段">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4B3FE3"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#B45309"/>
    </marker>
  </defs>
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 10.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  </style>
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">一次执行走四段，中间有个短路</text>
  <text class="ts" x="30" y="50">capture_model.cc:616 ExecuteCommon 已经把原来的单体拆成了四段</text>

  <!-- 四段横条 -->
  <rect x="36" y="66" width="150" height="46" rx="7" fill="#F2F7FF" stroke="rgba(75,63,227,0.30)"/>
  <text class="ts" x="48" y="84" style="fill:#1A1759;">① CheckExecuteReady</text>
  <text class="mono" x="48" y="102" style="font-size:9px;fill:#52525B;">:509</text>

  <rect x="196" y="66" width="150" height="46" rx="7" fill="#F2F7FF" stroke="rgba(75,63,227,0.45)" stroke-width="1.3"/>
  <text class="ts" x="208" y="84" style="fill:#1A1759;">② PreModelExecute</text>
  <text class="mono" x="208" y="102" style="font-size:9px;fill:#52525B;">:531</text>

  <rect x="356" y="66" width="150" height="46" rx="7" fill="#F2F7FF" stroke="rgba(75,63,227,0.30)"/>
  <text class="ts" x="368" y="84" style="fill:#1A1759;">③ ExecuteModel</text>
  <text class="mono" x="368" y="102" style="font-size:9px;fill:#52525B;">:582</text>

  <rect x="516" y="66" width="168" height="46" rx="7" fill="#F2F7FF" stroke="rgba(75,63,227,0.30)"/>
  <text class="ts" x="528" y="84" style="fill:#1A1759;">④ PostModelExecute</text>
  <text class="mono" x="528" y="102" style="font-size:9px;fill:#52525B;">:600</text>

  <path d="M186 89 L192 89" stroke="#4B3FE3" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M346 89 L352 89" stroke="#4B3FE3" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M506 89 L512 89" stroke="#4B3FE3" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- PreModelExecute 展开 -->
  <text class="ts" x="196" y="140" style="fill:#71717A;">② 展开（六步）</text>
  <path d="M271 114 L271 126" stroke="#A1A1AA" stroke-width="1.1"/>

  <rect x="36" y="148" width="648" height="108" rx="8" fill="#F7F7F8"/>
  <text class="mono" x="48" y="168" style="font-size:9.5px;">AddPreviousExecutionDependency</text>
  <text class="ts" x="330" y="168" style="fill:#71717A;">等上一次执行真跑完</text>

  <text class="mono" x="48" y="188" style="font-size:9.5px;">SetNotifyBeforeExecute</text>
  <text class="ts" x="330" y="188" style="fill:#71717A;">和 exeStream 外的任务对齐</text>

  <text class="mono" x="48" y="208" style="font-size:9.5px;fill:#B45309;">BuildSqCq</text>
  <text class="ts" x="330" y="208" style="fill:#B45309;">← 下面五个阶段</text>

  <text class="mono" x="48" y="228" style="font-size:9.5px;">InitAllSubCaptureModelCondTaskByDefValue</text>
  <text class="ts" x="330" y="228" style="fill:#71717A;">条件值复位</text>

  <text class="mono" x="48" y="248" style="font-size:9.5px;">PrepareGraphUpdateProc</text>
  <text class="ts" x="330" y="248" style="fill:#71717A;">图更新的准备</text>

  <!-- BuildSqCq 五阶段 -->
  <text class="ts" x="40" y="286" style="fill:#71717A;">BuildSqCq 内部（capture_model.cc:1550）</text>

  <rect x="36" y="296" width="648" height="42" rx="6" fill="#FFF7ED" stroke="rgba(180,83,9,0.30)"/>
  <text class="ts" x="48" y="314" style="fill:#B45309;">短路：sqCqArray_ != nullptr &amp;&amp; sqCqNum_ != 0 → refCount_++ 后直接返回</text>
  <text class="ts" x="48" y="331" style="fill:#71717A;">第二次之后每次执行都走这条，五阶段全部跳过</text>

  <rect x="36" y="346" width="316" height="30" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="48" y="366" style="font-size:9.5px;">AllocAllSqCq()</text>
  <text class="ts" x="240" y="366" style="fill:#71717A;">阶段二</text>

  <rect x="368" y="346" width="316" height="30" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="380" y="366" style="font-size:9.5px;">UpdateNotifyIdAll + LoadCompleteAll</text>
  <text class="ts" x="608" y="366" style="fill:#71717A;">阶段三</text>

  <rect x="36" y="384" width="316" height="30" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="48" y="404" style="font-size:9.5px;">UpdateStreamActiveTaskFuncCallMemAll()</text>
  <text class="ts" x="308" y="404" style="fill:#71717A;">四</text>

  <rect x="368" y="384" width="316" height="30" rx="5" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="mono" x="380" y="404" style="font-size:9.5px;">UpdateCondTaskFuncCallMemAll()</text>
  <text class="ts" x="622" y="404" style="fill:#71717A;">五</text>

  <text class="ts" x="40" y="432" style="fill:#71717A;">阶段一（Notify 申请 + 发 EndGraph）不在这 —— 源码注释：</text>
  <text class="mono" x="48" y="452" style="font-size:9px;fill:#B45309;">发送 endgraph 挪到了 endcapture 阶段</text>

  <!-- 底条 -->
  <rect x="36" y="470" width="648" height="36" rx="6" fill="#F7F7F8"/>
  <text class="ts" x="48" y="488" style="fill:#3F3A8C;">加速比的来源：第一次之后，建 SQ、绑 Notify、刷 SQE、发 EndGraph 全都不做了</text>
  <text class="ts" x="48" y="502" style="fill:#71717A;">只剩绑队列 + 推尾指针 + 等回来</text>
</svg>
