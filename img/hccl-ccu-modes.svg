<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="CCU_MS 与 CCU_SCHED 的数据路径与访存账对比">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { fill: #171717; font: 500 11.5px "SF Mono", Consolas, monospace; }
    .bd { fill: #1A1759; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.3; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" fill="#FFFFFF"/>

  <text class="tb" x="30" y="30">CCU 的两种模式：走不走片上缓存</text>
  <text class="ts" x="30" y="50">左：CCU_MS 用 CcuBuffer 中转做片内归约；右：CCU_SCHED 只调度 UB WQE 直传</text>

  <!-- 左：CCU_MS -->
  <rect x="30" y="64" width="320" height="278" rx="10" fill="#F2F7FF" stroke="rgba(75,63,227,0.32)"/>
  <text class="bd" x="46" y="86">CCU_MS · 片上缓存中转</text>
  <rect x="46" y="100" width="88" height="26" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ts" x="90" y="117" text-anchor="middle">对端 1</text>
  <rect x="146" y="100" width="88" height="26" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ts" x="190" y="117" text-anchor="middle">对端 2</text>
  <rect x="246" y="100" width="88" height="26" rx="6" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
  <text class="ts" x="290" y="117" text-anchor="middle">对端 n</text>
  <path class="arr" d="M90 128 L90 158" marker-end="url(#m1)"/>
  <path class="arr" d="M190 128 L190 158" marker-end="url(#m1)"/>
  <path class="arr" d="M290 128 L290 158" marker-end="url(#m1)"/>
  <rect x="76" y="160" width="228" height="38" rx="7" fill="#4B3FE3"/>
  <text class="th" x="190" y="177" text-anchor="middle" style="fill:#FFFFFF;">CcuBuffer（4KB / 片）</text>
  <text class="ts" x="190" y="193" text-anchor="middle" style="fill:#EDEBFF;">最多 8 片按序 Reduce</text>
  <path class="arr" d="M190 200 L190 222" marker-end="url(#m1)"/>
  <rect x="76" y="224" width="228" height="34" rx="7" fill="#FFFFFF" stroke="rgba(75,63,227,0.3)"/>
  <text class="th" x="190" y="246" text-anchor="middle">本地内存：读 1 次、写回 1 次</text>
  <text class="ts" x="46" y="280">不用缓存：2(n−1) 读 + (n−1) 写</text>
  <text class="ts" x="46" y="300" style="fill:#3F3A8C;">用缓存：n 读 + 1 写，省约一个数量级</text>
  <text class="ts" x="46" y="324">Broadcast 同理，读次数降到 1 次</text>

  <!-- 右：CCU_SCHED -->
  <rect x="370" y="64" width="320" height="278" rx="10" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text class="bd" x="386" y="86">CCU_SCHED · 调度模式</text>
  <rect x="386" y="100" width="126" height="38" rx="7" fill="#F2F7FF" stroke="#4B3FE3"/>
  <text class="th" x="449" y="124" text-anchor="middle">CCU（调度器）</text>
  <rect x="536" y="100" width="138" height="38" rx="7" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="th" x="605" y="118" text-anchor="middle">UB WQE 队列</text>
  <text class="ts" x="605" y="133" text-anchor="middle">jetty / WQEBB</text>
  <path class="arr" d="M514 119 L534 119" marker-end="url(#m1)"/>
  <path class="arr" d="M605 140 L605 168" marker-end="url(#m1)"/>
  <rect x="386" y="170" width="288" height="38" rx="7" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="th" x="530" y="194" text-anchor="middle">rank 间片上内存 → 片上内存直传</text>
  <text class="ts" x="386" y="232">不用 CcuBuffer，不受 4KB 分片限制</text>
  <text class="ts" x="386" y="252">CCU 只负责同步与下发 WQE</text>
  <rect x="386" y="268" width="288" height="58" rx="7" fill="#FFFFFF" stroke="rgba(23,23,23,0.1)"/>
  <text class="ts" x="398" y="288">单机归约类数据量超阈值 → AI_CPU</text>
  <text class="ts" x="398" y="308">ReduceScatterV / AllGatherV 仅单 Server</text>

  <!-- 回退条件 -->
  <rect x="30" y="352" width="660" height="60" rx="9" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text class="bd" x="46" y="372">自动回退（两种模式共有的两条触发线）</text>
  <text class="ts" x="46" y="394">① CCU 片上资源不足 → AI_CPU　　② CCU_SCHED 单机归约数据量超阈值 → AI_CPU</text>
  <text class="ts" x="46" y="410" style="fill:#9F1239;">另有产品限制：950PR 不支持 CCU_MS；CCU_MS 仅单机、仅 5 类算子</text>
</svg>
