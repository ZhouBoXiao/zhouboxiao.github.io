<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-label="device 侧第一个 task 是 NotifyWait，把通信挂在 host stream 依赖链上">
  <style>
    .tb { fill: #171717; font: 500 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ts { fill: #52525B; font: 400 11px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .th { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .ns { fill: #52525B; font: 400 10px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .bd { fill: #1A1759; font: 500 11.5px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .wt { fill: #FFFFFF; font: 500 11.5px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .arr { stroke: #4B3FE3; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .arrg { stroke: #9CA3AF; stroke-width: 1.4; stroke-linecap: round; fill: none; }
    .dep { stroke: #4B3FE3; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="n1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="n2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="396" fill="#FFFFFF"/>
  <text class="tb" x="30" y="30">为什么展开出来的第一个 task 是「等通知」</text>
  <text class="ts" x="30" y="50">host 下发 kernel 是异步的 —— 不先等一下，搬的就是还没算好的数据</text>

  <!-- 泳道标签 -->
  <text class="th" x="30" y="104">Host stream</text>
  <text class="ns" x="30" y="120">（总部）</text>
  <text class="th" x="30" y="216">Device 主 thread</text>
  <text class="ns" x="30" y="232">（项目经理）</text>

  <!-- Host 泳道 -->
  <rect x="150" y="86" width="140" height="46" rx="7" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="bd" x="220" y="105" text-anchor="middle" style="fill:#171717;">计算 kernel</text>
  <text class="ns" x="220" y="122" text-anchor="middle">写 input 张量</text>

  <path class="arrg" d="M294 109 L306 109" marker-end="url(#n2)"/>

  <rect x="310" y="86" width="120" height="46" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="bd" x="370" y="105" text-anchor="middle">NotifyRecord</text>
  <text class="ns" x="370" y="122" text-anchor="middle">「前面做完了」</text>

  <path class="arrg" d="M434 109 L446 109" marker-end="url(#n2)"/>

  <rect x="450" y="86" width="130" height="46" rx="7" fill="#FFFFFF" stroke="rgba(23,23,23,0.16)"/>
  <text class="bd" x="515" y="105" text-anchor="middle" style="fill:#171717;">下发 comm kernel</text>
  <text class="ns" x="515" y="122" text-anchor="middle">host 提交完就返回</text>

  <rect x="600" y="86" width="90" height="46" rx="7" fill="#F7F7F8" stroke="rgba(23,23,23,0.14)"/>
  <text class="bd" x="645" y="105" text-anchor="middle" style="fill:#52525B;">等回收</text>
  <text class="ns" x="645" y="122" text-anchor="middle">挂起等待</text>

  <!-- 启动箭头 -->
  <path class="arr" d="M515 136 L515 172" marker-end="url(#n1)"/>
  <text class="ns" x="524" y="158">kernel 启动</text>

  <!-- Device 泳道 -->
  <rect x="450" y="176" width="130" height="52" rx="7" fill="#4B3FE3" stroke="#4B3FE3"/>
  <text class="wt" x="515" y="196" text-anchor="middle">① NotifyWait</text>
  <text class="wt" x="515" y="214" text-anchor="middle">第一个 task</text>

  <path class="arr" d="M584 202 L596 202" marker-end="url(#n1)"/>

  <rect x="600" y="176" width="90" height="52" rx="7" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.2"/>
  <text class="bd" x="645" y="196" text-anchor="middle">② 搬运 ×N</text>
  <text class="bd" x="645" y="214" text-anchor="middle">几百个 task</text>

  <!-- 依赖虚线 -->
  <path class="dep" d="M370 132 L370 152 L515 152 L515 172" marker-end="url(#n1)"/>
  <text class="ns" x="443" y="146" text-anchor="middle" style="fill:#1A1759;">等的就是这一个</text>

  <!-- 回执 -->
  <path class="arr" d="M645 232 L645 258 L600 258" marker-end="url(#n1)"/>
  <text class="ns" x="650" y="250">干完了</text>
  <rect x="450" y="244" width="140" height="30" rx="6" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.1"/>
  <text class="bd" x="520" y="263" text-anchor="middle">NotifyRecord → host 返回</text>

  <text class="ts" x="30" y="300">结果：整个通信链路被严丝合缝挂在了 host stream 的依赖链上。host 看来只是「提交了一个 kernel」，</text>
  <text class="ts" x="30" y="320">实际上那几百张单子全部继承了 host 侧的先后顺序。</text>

  <rect x="30" y="336" width="660" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
  <text class="ns" x="46" y="356" style="fill:#991B1B;">如果少了这一步：kernel 一上来就开始搬运，读到的是还没算完的 input —— 不报错，只表现为偶发结果错，极难定位。</text>
  <text class="ns" x="46" y="372" style="fill:#991B1B;">这也是 device 侧「先 NotifyWait，再构造 executor → Orchestrate()」这个顺序不能颠倒的原因。</text>
</svg>
